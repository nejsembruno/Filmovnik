  .starfield::before {
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(
        ellipse at center,
        rgba(0,0,0,.64) 0%,
        rgba(1,2,5,.55) 30%,
        rgba(2,4,8,.28) 62%,
        rgba(0,0,0,0) 100%
      );
  }
  .starfield::after { content:none; }
  .dust { display:none; }
  .dust span { position: absolute; width: 2px; height: 2px; background: #cfcfd6; border-radius: 50%; }
  .stars-layer { display:none; }
  .star {
    position: absolute; width: 9px; height: 9px; background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.8;
  }
  .star.sm { width: 5px; height: 5px; opacity: 0.55; }
  .star.lg { width: 12px; height: 12px; opacity: 0.9; }

  .content { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 28px 18px 130px; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 4px 26px; }
  header h1 { font-family: 'Courier New', Courier, monospace; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }

  .view { display: none; }
  .view.active { display: block; }

  .movie-list, .watch-list { display: flex; flex-direction: column; gap: 10px; }

  .movie-row {
    display: flex; gap: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 10px; align-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .poster {
    width: 56px; height: 84px; border-radius: 8px; flex-shrink: 0;
    background-size: cover; background-position: center; background-color: #1e1e24;
  }
  .movie-info { flex: 1; min-width: 0; }
  .movie-info h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ratings { display: flex; gap: 16px; margin-top: 6px; }
  .rating { font-size: 12px; color: var(--text-dim); }
  .rating strong { color: var(--gold-bright); font-size: 15px; font-weight: 700; margin-right: 3px; }

  .watch-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 12px 14px;
  }
  .watch-check {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--text-dim); background: none; padding: 0;
  }
  .watch-check:active { transform: scale(0.9); }
  .watch-info { flex: 1; min-width: 0; }
  .watch-title { font-size: 15px; font-weight: 600; }
  .watch-tags { display: flex; gap: 6px; margin-top: 6px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 999px; margin-top: 2px;
  }
  .badge-watching { color: #16130a; background: var(--gold-bright); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .movie-row.enter, .watch-row.enter { animation: rowIn 0.3s ease-out; }

  .fab {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: var(--gold); color: #16130a; font-weight: 600; font-size: 14px;
    padding: 14px 22px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(199,173,110,0.22); border: none;
  }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-width: 480px; margin: 0 auto; display: flex;
    background: #131318; border-top: 1px solid var(--card-border);
    padding: 10px 0 22px;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text-dim); font-size: 11px; font-weight: 600;
    font-family: inherit;
  }
  .tab-btn.active { color: var(--gold-bright); }

  /* --- bottom sheets --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 480px; margin: 0 auto;
    background: #131318; border-radius: 20px 20px 0 0;
    border: 1px solid var(--card-border);
    padding: 8px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    max-height: 85vh; overflow-y: auto;
  }
  .sheet.active { transform: translateY(0); }

  .sheet-close {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 10px 0 16px; background: none; border: none;
  }
  .sheet-close svg { display: block; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .field input[type="text"], .field input[type="url"], .field textarea {
    width: 100%; background: #1b1b21; border: 1px solid var(--card-border);

  <div class="starfield">
    <div class="dust" id="dust"></div>
    <div class="stars-layer" id="stars"></div>
  </div>

  <div class="content">
    <header>
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-label="Logo Filmovníku">
          <path d="M32 18c-4.7 0-8.6-2.5-13.2-2.5C10.7 15.5 6 21.8 6 31c0 7.2 2.8 14.2 6.7 19 3 3.8 6.1 6.5 10.1 6.5 3.6 0 5.7-2.2 9.2-2.2s5.6 2.2 9.2 2.2c4 0 7.1-2.7 10.1-6.5 3.9-4.8 6.7-11.8 6.7-19 0-9.2-4.7-15.5-12.8-15.5C40.6 15.5 36.7 18 32 18Z" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M33.5 14.5c2.5-5.1 6.7-8.1 12-8.8-.4 5.2-3.2 9-7.8 11-1.5.6-2.9.8-4.2.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M27.8 27.4 41.2 35 27.8 42.6Z" fill="var(--bg)" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
        </svg>
        <div class="brand-copy"><h1>Filmovník</h1><div class="header-summary" id="headerSummary">0 hodnoceno • 0 ve watchlistu</div></div>
      </div>
    </header>

    <div class="view active" id="viewRated">
      <div class="movie-list" id="movieList"></div>
    </div>

    <div class="view" id="viewWatchlist">
      <div class="watch-list" id="watchlistList"></div>
    </div>

    <div class="view hall-view" id="viewHall">
      <div id="hallContent"></div>
    </div>
  </div>

  <button class="fab" id="openAdd">+ Přidat film</button>

  <div class="save-toast" id="saveToast" role="status" aria-live="polite">Uloženo</div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabRated">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.7z" fill="currentColor"/></svg>
      Hodnocené
    </button>
    <button class="tab-btn" id="tabWatch">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3h12v18l-6-4.2L6 21V3z" fill="currentColor"/></svg>
      Watchlist
    </button>
    <button class="tab-btn" id="tabHall" aria-label="Síň slávy">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M8 4h8v4c0 3-1.8 5-4 5s-4-2-4-5V4Z" fill="currentColor"/><path d="M8 6H5v1c0 2.4 1.3 4 4 4M16 6h3v1c0 2.4-1.3 4-4 4M12 13v4m-4 3h8m-6-3h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Síň slávy
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- sheet: přidat / upravit hodnocený film -->
<div class="sheet" id="addSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <div class="autocomplete-wrap"><input type="text" id="inpTitle" placeholder="Začni psát název…" autocomplete="off"><div class="suggestions" id="titleSuggestions"></div></div>
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="categoryToggle">
      <div class="segment-indicator" id="categoryIndicator"></div>
      <button type="button" class="segment active" data-value="film">Film</button>
      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>
  </div>
  <div class="field">
    <label>URL plakátu</label>
    <input type="url" id="inpPoster" placeholder="Doplní se automaticky z TMDB"><div class="tmdb-status" id="tmdbStatus"></div>
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Brunovo hodnocení</label><span class="star-value" id="valMe">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starMe"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingMe"></div>
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Zuzčino hodnocení</label><span class="star-value" id="valHer">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starHer"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingHer"></div>
  </div>
  <div class="field">
    <label>Poznámka (nepovinné)</label>
    <textarea id="inpNote" placeholder="Pár slov k filmu..."></textarea>
  </div>
  <button class="sheet-btn" id="saveMovie">Uložit film</button>
</div>

<!-- sheet: přidat na watchlist -->
<div class="sheet" id="watchAddSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <div class="autocomplete-wrap"><input type="text" id="inpWatchTitle" placeholder="Začni psát název…" autocomplete="off"><div class="suggestions" id="watchSuggestions"></div></div>
    <div class="tmdb-status" id="watchTmdbStatus"></div>
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="watchCategoryToggle">
      <div class="segment-indicator" id="watchCategoryIndicator"></div>
      <button type="button" class="segment active" data-value="film">Film</button>
      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>
  </div>
  <div class="field" id="watchingField" style="display:none;">
    <label class="switch-row">
      <span>Sledujeme teď</span>
      <input type="checkbox" id="inpWatching">
    </label>
  </div>
  <button class="sheet-btn" id="saveWatch">Přidat na watchlist</button>
</div>

<!-- sheet: detail hodnoceného filmu -->
<div class="sheet" id="detailSheet">
  <div class="detail-hero">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <button class="sheet-close hero-close" data-close>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#c9cad2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="detail-poster-wrap"><div class="detail-poster-glow" id="detailPosterGlow"></div><div class="detail-poster" id="detailPoster"></div></div>
  </div>
  <div class="detail-content">
  <div class="detail-title" id="detailTitle"></div>
  <span class="badge" id="detailBadge"></span><div class="detail-meta" id="detailMeta"></div><div class="detail-description" id="detailDescription"></div>
  <div class="detail-ratings" style="margin-top:14px;">
    <span class="rating"><strong id="detailMe"></strong>Bruno</span>
    <span class="rating"><strong id="detailHer"></strong>Zuzi</span>
  </div>
  <div class="detail-note" id="detailNote"></div>
  <button class="sheet-btn-ghost" id="editMovie">Upravit</button>
</div>
</div>


<div class="sheet confirm-sheet" id="confirmSheet">
  <button class="sheet-close" data-close aria-label="Zavřít"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h2>Smazat položku?</h2>
  <p id="confirmText"></p>
  <div class="confirm-actions">
    <button class="confirm-cancel" id="cancelDelete">Zrušit</button>
    <button class="confirm-delete" id="confirmDelete">Smazat</button>
  </div>
</div>
<script>

  function haptic(pattern = 8) {
    try { if ('vibrate' in navigator) navigator.vibrate(pattern); } catch (e) {}
  }


  const TMDB_API_KEY = '0899dead6866fb139e5cb434f0863ab5';
  const TMDB_BASE = 'https://api.themoviedb.org/3';
  const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
  let pendingTmdbData = null;
  const tmdbGenreCache = { movie: null, tv: null };
  const tmdbSearchCache = new Map();
  const tmdbSuggestionCache = new Map();

  async function getTmdbGenres(type) {
    if (tmdbGenreCache[type]) return tmdbGenreCache[type];
    const response = await fetch(`${TMDB_BASE}/genre/${type}/list?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ`);
    if (!response.ok) throw new Error('genre');
    const data = await response.json();
    tmdbGenreCache[type] = Object.fromEntries((data.genres || []).map(g => [g.id, g.name]));
    return tmdbGenreCache[type];
  }

  async function loadTmdbData(title, category, force = false, statusId = 'tmdbStatus') {
    const status = document.getElementById(statusId);
    if (!title) return null;
    if (!force && pendingTmdbData?.query === title && pendingTmdbData?.category === category) return pendingTmdbData;
    if (status) { status.className = 'tmdb-status'; status.textContent = 'Hledám údaje na TMDB…'; }
    try {
      const type = category === 'serial' ? 'tv' : 'movie';
      const cacheKey = `${type}:${title.toLowerCase()}`;
      let found = tmdbSearchCache.get(cacheKey);
      if (found === undefined) {
        const response = await fetch(`${TMDB_BASE}/search/${type}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ&query=${encodeURIComponent(title)}&include_adult=false`);
        if (!response.ok) throw new Error('search');
        const data = await response.json();
        found = data.results?.[0] || null;
        tmdbSearchCache.set(cacheKey, found);
      }
      if (!found) { if (status) status.textContent = 'Na TMDB nenalezeno. Můžeš uložit ručně.'; pendingTmdbData = null; return null; }
      const genreMap = await getTmdbGenres(type);
      const releaseDate = category === 'serial' ? found.first_air_date : found.release_date;
      pendingTmdbData = {
        query: title,
        category,
        tmdbId: found.id,
        poster: found.poster_path ? TMDB_IMAGE_BASE + found.poster_path : '',
        genres: (found.genre_ids || []).map(id => genreMap[id]).filter(Boolean),
        year: releaseDate ? releaseDate.slice(0,4) : '',
        description: found.overview || ''
      };
      const posterInput = document.getElementById('inpPoster');
      if (posterInput && !posterInput.value.trim() && pendingTmdbData.poster) posterInput.value = pendingTmdbData.poster;
      if (status) { status.className = 'tmdb-status ok'; status.textContent = ['Nalezeno', pendingTmdbData.year, pendingTmdbData.genres.join(' • ')].filter(Boolean).join(': ').replace(': :', ': '); }
      return pendingTmdbData;
    } catch (error) {
      if (status) status.textContent = 'TMDB údaje se nepodařilo načíst. Položku můžeš uložit i bez nich.';
      pendingTmdbData = null;
      return null;
    }
  }

  // --- hvězdné pozadí ---
  const starPositions = [
    [5,3,'sm'],[20,5,'lg'],[42,4,'md'],[68,5,'md'],[80,8,'sm'],[95,3,'sm'],
    [3,10,'sm'],[92,14,'md'],[2,26,'sm'],[97,30,'md'],[3,45,'sm'],[96,42,'lg'],
    [2,60,'sm'],[95,58,'md'],[3,75,'sm'],[93,72,'md'],
    [8,92,'md'],[22,96,'sm'],[42,99,'sm'],[58,97,'md'],[73,94,'sm'],[88,90,'lg'],
    [13,86,'sm'],[46,88,'sm']
  ];
  const starsBg = document.getElementById('stars');
  starPositions.forEach(([x,y,size]) => {
    const el = document.createElement('div');
    el.className = 'star' + (size === 'sm' ? ' sm' : size === 'lg' ? ' lg' : '');
    el.style.left = x + '%'; el.style.top = y + '%';
    starsBg.appendChild(el);
  });
  const dust = document.getElementById('dust');
  let dustHtml = '';
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 100, y = Math.random() * 100, s = Math.random() * 1.4 + 0.5;
    dustHtml += `<span style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;opacity:${Math.random()*0.4+0.15}"></span>`;
  }
  dust.innerHTML = dustHtml;

  // --- star rating slider ---
  function starColor(t) {
    const from = [212, 208, 199], to = [230, 175, 55];
    const r = Math.round(from[0] + (to[0]-from[0])*t);
    const g = Math.round(from[1] + (to[1]-from[1])*t);
    const b = Math.round(from[2] + (to[2]-from[2])*t);
    return `rgb(${r},${g},${b})`;
  }
  function buildStarSlider(containerId) {
    const row = document.getElementById(containerId);
    for (let i = 0; i < 5; i++) {
      const cell = document.createElement('div');
      cell.className = 'star-cell';
      const bg = document.createElement('div');
      bg.className = 'star-shape star-bg';
      const fillClip = document.createElement('div');
      fillClip.className = 'star-fill-clip';
      fillClip.dataset.index = i;
      const fillShape = document.createElement('div');
      fillShape.className = 'star-shape';
      fillShape.style.background = starColor(i / 4);
      fillClip.appendChild(fillShape);
      cell.appendChild(bg);
      cell.appendChild(fillClip);
      row.appendChild(cell);
    }
  }
  function updateStarSlider(containerId, value) {
    const row = document.getElementById(containerId);
    row.querySelectorAll('.star-fill-clip').forEach(clip => {
      const i = parseInt(clip.dataset.index);
      const frac = Math.max(0, Math.min(1, value - i));
      clip.style.clipPath = `inset(0 ${(1 - frac) * 100}% 0 0)`;
    });
  }
  buildStarSlider('starMe');
  buildStarSlider('starHer');
  updateStarSlider('starMe', 3.5);
  updateStarSlider('starHer', 3.5);

  const rMe = document.getElementById('inpRatingMe');
  const rHer = document.getElementById('inpRatingHer');
  function tap(containerId, value) {
    const row = document.getElementById(containerId);
    const idx = Math.min(4, Math.max(0, Math.ceil(value) - 1));
    const cell = row.querySelectorAll('.star-cell')[idx];
    cell.classList.remove('tap'); void cell.offsetWidth; cell.classList.add('tap');
  }
  function bindPreciseStarSlider(input, containerId, valueId) {
    const slider=input.closest('.star-slider');
    let dragging=false;
    let lastValue=Number(input.value);

    function setFromPointer(event) {
      const rect=slider.getBoundingClientRect();
      const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      const value=Math.max(0.5,Math.min(5,Math.round((ratio*5)*2)/2));
      if (value===Number(input.value)) return;
      input.value=String(value);
      updateStarSlider(containerId,value);
      document.getElementById(valueId).textContent=value.toFixed(1);
      tap(containerId,value);
      input.dispatchEvent(new Event('input',{bubbles:true}));
      if (value!==lastValue) { haptic(5); lastValue=value; }
    }

    slider.addEventListener('pointerdown',event=>{
      dragging=true;
      slider.setPointerCapture(event.pointerId);
      setFromPointer(event);
      event.preventDefault();
    });
    slider.addEventListener('pointermove',event=>{
      if(!dragging)return;
      setFromPointer(event);
      event.preventDefault();
    });
    const finish=event=>{
      if(!dragging)return;
      dragging=false;
      if(slider.hasPointerCapture(event.pointerId))slider.releasePointerCapture(event.pointerId);
      haptic(10);
    };
    slider.addEventListener('pointerup',finish);
    slider.addEventListener('pointercancel',finish);
    input.addEventListener('keydown',()=>window.setTimeout(()=>{
      const value=Number(input.value);
      updateStarSlider(containerId,value);
      document.getElementById(valueId).textContent=value.toFixed(1);
    },0));
  }
  bindPreciseStarSlider(rMe,'starMe','valMe');
  bindPreciseStarSlider(rHer,'starHer','valHer');

  // --- kategorie: hodnocené sheet ---
  function normalizeCategory(value) {
    const category = String(value || '').trim().toLowerCase();
    return ['serial','series','tv','seriál','seriaľ'].includes(category) ? 'serial' : 'film';
  }
  const categoryLabels = { film: 'Film', serial: 'Seriál' };
  let selectedCategory = 'film';
  const categoryIndicator = document.getElementById('categoryIndicator');
  function setCategoryUI(value) {
    selectedCategory = value;
    document.querySelectorAll('#categoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    categoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
    if (editingIndex === null) document.getElementById('saveMovie').textContent = value === 'serial' ? 'Uložit seriál' : 'Uložit film';
  }
  document.querySelectorAll('#categoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => { setCategoryUI(btn.dataset.value); if (typeof ratedAutocomplete !== 'undefined') ratedAutocomplete.refresh(); });
  });

  // --- kategorie: watchlist sheet ---
  let selectedWatchCategory = 'film';
  const watchCategoryIndicator = document.getElementById('watchCategoryIndicator');
  const watchingField = document.getElementById('watchingField');
  const inpWatching = document.getElementById('inpWatching');
  function setWatchCategoryUI(value) {
    selectedWatchCategory = value;
    document.querySelectorAll('#watchCategoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    watchCategoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
    watchingField.style.display = value === 'serial' ? 'block' : 'none';
    if (value !== 'serial') inpWatching.checked = false;
  }
  document.querySelectorAll('#watchCategoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => { setWatchCategoryUI(btn.dataset.value); if (typeof watchAutocomplete !== 'undefined') watchAutocomplete.refresh(); });
  });

  
  const STORAGE_MOVIES = "filmovnik_movies";
  const STORAGE_WATCHLIST = "filmovnik_watchlist";

  function saveData() {
    localStorage.setItem(STORAGE_MOVIES, JSON.stringify(movies));
    localStorage.setItem(STORAGE_WATCHLIST, JSON.stringify(watchlist));
  }

  function loadStoredData() {
    try {
      const m = JSON.parse(localStorage.getItem(STORAGE_MOVIES) || 'null');
      const w = JSON.parse(localStorage.getItem(STORAGE_WATCHLIST) || 'null');
      if (Array.isArray(m)) movies = m.map(item => ({...item, category: normalizeCategory(item.category)}));
      if (Array.isArray(w)) watchlist = w.map(item => ({...item, category: normalizeCategory(item.category)}));
    } catch(e) { console.warn('Storage load failed', e); }
  }

  // --- data ---
  let movies = [
    { title: "Perfect Days", category: "film", poster: "", me: 8, her: 9, note: "Klidný, pomalý film o obyčejném životě, který má krásu v detailech." },
    { title: "Anora", category: "film", poster: "", me: 7, her: 7, note: "" },
    { title: "The Bear", category: "serial", poster: "", me: 9, her: 8, note: "" },
    { title: "Poor Things", category: "film", poster: "", me: 9, her: 6, note: "Vizuálně unikátní, ale ne pro každého." }
  ];
  loadStoredData();

  let watchlist = [
    { title: "Poslední z nás", category: "serial", watching: true },
    { title: "Duna: Část druhá", category: "film", watching: false }
  ];
  let editingIndex = null;
  let currentDetailIndex = null;

  loadStoredData();

  const posterFallback = [
    "linear-gradient(160deg,#3a2f1f,#161217)",
    "linear-gradient(160deg,#1f2a3a,#12141c)",
    "linear-gradient(160deg,#2f1f2a,#141116)"
  ];


  const iconEdit = `<svg viewBox="0 0 24 24" fill="none"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const iconDelete = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let pendingDelete = null;
  function bindSwipe(row, onEdit, onDelete) {
    let sx=0, sy=0, dx=0, tracking=false, horizontal=false, suppressClick=false;
    const shell=row.closest('.swipe-shell'), editHint=shell.querySelector('.swipe-hint.edit'), deleteHint=shell.querySelector('.swipe-hint.delete');
    row.addEventListener('touchstart', e=>{ if(e.touches.length!==1)return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; tracking=true; horizontal=false; row.style.transition='none'; },{passive:true});
    row.addEventListener('touchmove', e=>{ if(!tracking)return; const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy; if(!horizontal && Math.abs(x)>8) horizontal=Math.abs(x)>Math.abs(y); if(!horizontal)return; e.preventDefault(); dx=Math.max(-105,Math.min(105,x)); if(!onEdit&&dx>0)dx=0; row.style.transform=`translateX(${dx}px)`; editHint.style.opacity=dx>8?Math.min(1,(dx-8)/55):0; deleteHint.style.opacity=dx<-8?Math.min(1,(-dx-8)/55):0; },{passive:false});
    row.addEventListener('touchend', ()=>{ if(!tracking)return; tracking=false; row.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)'; row.style.transform=''; editHint.style.opacity=0; deleteHint.style.opacity=0; if(Math.abs(dx)>15)suppressClick=true; if(dx>70&&onEdit){haptic(12);onEdit();} if(dx<-70&&onDelete){haptic([10,35,10]);onDelete();} setTimeout(()=>suppressClick=false,280); });
    row.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();}},true);
  }
  function requestDelete(type,index,title){ pendingDelete={type,index}; document.getElementById('confirmText').textContent=`Opravdu chceš smazat „${title}“?`; overlay.classList.add('active'); confirmSheet.classList.add('active'); }
  function openEditAt(index){
    const m=movies[index]; editingIndex=index;
    document.getElementById('inpTitle').value=m.title; document.getElementById('inpPoster').value=m.poster; document.getElementById('inpNote').value=m.note;
    pendingTmdbData={query:m.title,category:m.category,tmdbId:m.tmdbId||null,poster:m.poster||'',genres:m.genres||[],year:m.year||'',description:m.description||''};
    document.getElementById('tmdbStatus').textContent=[m.year,...(m.genres||[])].filter(Boolean).join(' • ');
    document.getElementById('tmdbStatus').className='tmdb-status ok';
    setCategoryUI(m.category); const meVal=m.me/2,herVal=m.her/2; rMe.value=meVal;rHer.value=herVal;
    updateStarSlider('starMe',meVal);updateStarSlider('starHer',herVal);document.getElementById('valMe').textContent=meVal;document.getElementById('valHer').textContent=herVal;

  (function enableDetailPullDown() {
    const handle = detailSheet.querySelector('.sheet-close');
    let startY = 0;
    let currentY = 0;
    let dragging = false;

    function resetDetailPosition() {
      detailSheet.classList.remove('dragging');
      detailSheet.style.transform = '';
      overlay.style.opacity = '';
    }

    handle.addEventListener('pointerdown', event => {
      if (!detailSheet.classList.contains('active')) return;
      dragging = true;
      startY = event.clientY;
      currentY = 0;
      detailSheet.classList.add('dragging');
      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    handle.addEventListener('pointermove', event => {
      if (!dragging) return;
      currentY = Math.max(0, event.clientY - startY);
      detailSheet.style.transform = `translateY(${currentY}px)`;
      const fade = Math.max(0, 1 - currentY / 320);
      overlay.style.opacity = String(fade);
      event.preventDefault();
    });

    function finishPullDown(event) {
      if (!dragging) return;
      dragging = false;
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
      detailSheet.classList.remove('dragging');

      if (currentY > 110) {
        detailSheet.style.transition = 'transform .22s cubic-bezier(.4,0,1,1)';
        detailSheet.style.transform = 'translateY(100%)';
        overlay.style.opacity = '0';
        window.setTimeout(() => {
          closeSheets();
          detailSheet.style.transition = '';
          resetDetailPosition();
        }, 220);
      } else {
        detailSheet.style.transition = 'transform .24s cubic-bezier(.32,.72,0,1)';
        detailSheet.style.transform = 'translateY(0)';
        overlay.style.opacity = '';
        window.setTimeout(() => {
          detailSheet.style.transition = '';
          detailSheet.style.transform = '';
        }, 240);
      }
      currentY = 0;
    }

    handle.addEventListener('pointerup', finishPullDown);
    handle.addEventListener('pointercancel', finishPullDown);
  })();

  function debounce(fn, wait=350) {
    let timer=null;
    const wrapped=(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),wait);};
    wrapped.cancel=()=>{clearTimeout(timer);timer=null;};
    return wrapped;
  }

  function escapeAutocompleteText(value='') {
    return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }

  async function searchTmdbSuggestions(query,category,signal) {
    const type=category==='serial'?'tv':'movie';
    const cacheKey=`${type}:${query.toLowerCase()}`;
    const cached=tmdbSuggestionCache.get(cacheKey);
    if(cached)return cached;
    const response=await fetch(`${TMDB_BASE}/search/${type}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ&query=${encodeURIComponent(query)}&include_adult=false`,{signal});
    if(!response.ok)throw new Error(`TMDB ${response.status}`);
    const data=await response.json();
    const mapped=(data.results||[]).slice(0,6).map(item=>{
      const date=category==='serial'?item.first_air_date:item.release_date;
      return {
        tmdbId:item.id,
        title:category==='serial'?(item.name||item.original_name):(item.title||item.original_title),
        originalTitle:category==='serial'?item.original_name:item.original_title,
        year:date?date.slice(0,4):'',
        poster:item.poster_path?TMDB_IMAGE_BASE+item.poster_path:'',
        genreIds:item.genre_ids||[],
        description:item.overview||''
      };
    }).filter(item=>item.title);
    tmdbSuggestionCache.set(cacheKey,mapped);
    return mapped;
  }

  function setupAutocomplete(inputId,listId,getCategory,onPick) {
    const input=document.getElementById(inputId);
    const list=document.getElementById(listId);
    const wrap=input.closest('.autocomplete-wrap');
    let results=[];
    let controller=null;
    let searchVersion=0;
    let activeIndex=-1;
    let ignoreNextFocus=false;

    function hideList() {
      list.classList.remove('active');
      list.innerHTML='';
      activeIndex=-1;
    }

    function cancelSearch() {
      searchVersion++;
      controller?.abort();
      controller=null;
      search.cancel();
    }

    async function selectResult(index) {
      const item=results[index];
      if(!item)return;
      cancelSearch();
      ignoreNextFocus=true;
      input.value=item.title;
      hideList();
      const category=getCategory();
      const type=category==='serial'?'tv':'movie';
      let genreMap={};
      try{genreMap=await getTmdbGenres(type);}catch(e){}
      pendingTmdbData={
        query:item.title,category,tmdbId:item.tmdbId,poster:item.poster,
        genres:item.genreIds.map(id=>genreMap[id]).filter(Boolean),
        year:item.year,description:item.description
      };
      onPick(pendingTmdbData);
      input.blur();
      window.setTimeout(()=>{ignoreNextFocus=false;},250);
      haptic(8);
    }

    async function performSearch() {
      const query=input.value.trim();
      if(query.length<2){cancelSearch();hideList();return;}
      const version=++searchVersion;
      controller?.abort();
      controller=new AbortController();
      list.innerHTML=Array.from({length:3},()=>'<div class="suggestion-skeleton"><span class="skeleton-poster"></span><span class="skeleton-copy"><span class="skeleton-line"></span><span class="skeleton-line short"></span></span></div>').join('');
      list.classList.add('active');
      try{
        const found=await searchTmdbSuggestions(query,getCategory(),controller.signal);
        if(version!==searchVersion)return;
        results=found;
        if(!found.length){list.innerHTML='<div class="suggestion-empty">Nic nenalezeno</div>';return;}
        list.innerHTML=found.map((item,index)=>{
          const title=escapeAutocompleteText(item.title);
          const original=item.originalTitle&&item.originalTitle!==item.title?escapeAutocompleteText(item.originalTitle):'';
          const meta=[item.year,original].filter(Boolean).join(' • ');
          const poster=item.poster?`background-image:url('${item.poster}')`:'';
          return `<button type="button" class="suggestion suggestion-in" style="animation-delay:${index*28}ms" data-index="${index}"><span class="suggestion-poster" style="${poster}"></span><span class="suggestion-info"><span class="suggestion-title">${title}</span><span class="suggestion-meta">${meta}</span></span></button>`;
        }).join('');
      }catch(error){
        if(error.name==='AbortError'||version!==searchVersion)return;
        list.innerHTML='<div class="suggestion-empty">Našeptávání se nepodařilo načíst</div>';
      }
    }

    const search=debounce(performSearch);
    input.addEventListener('input',()=>{pendingTmdbData=null;search();});
    input.addEventListener('focus',()=>{if(ignoreNextFocus)return;if(input.value.trim().length>=2)search();});

    // Delegace je stabilnější než přidávat posluchač každému výsledku po každém renderu.
    list.addEventListener('pointerdown',event=>{
      const button=event.target.closest('.suggestion');
      if(!button)return;
      event.preventDefault();
      event.stopPropagation();
      selectResult(Number(button.dataset.index));
    });

    input.addEventListener('keydown',event=>{
      if(event.key==='Escape'){cancelSearch();hideList();return;}
      if(!results.length)return;
      if(event.key==='ArrowDown'){event.preventDefault();activeIndex=(activeIndex+1)%results.length;}
      else if(event.key==='ArrowUp'){event.preventDefault();activeIndex=activeIndex<=0?results.length-1:activeIndex-1;}
      else if(event.key==='Enter'&&activeIndex>=0){event.preventDefault();selectResult(activeIndex);return;}
      else return;
      list.querySelectorAll('.suggestion').forEach((button,index)=>button.classList.toggle('selected',index===activeIndex));
      list.querySelectorAll('.suggestion')[activeIndex]?.scrollIntoView({block:'nearest'});
    });

    document.addEventListener('pointerdown',event=>{
      if(!wrap.contains(event.target)){cancelSearch();hideList();}
    });

    return {
      refresh:()=>{cancelSearch();if(input.value.trim().length>=2)performSearch();},
      close:()=>{cancelSearch();hideList();}
    };
  }

    document.getElementById('detailTitle').textContent = m.title;
    document.getElementById('detailBadge').textContent = categoryLabels[normalizeCategory(m.category)];
    document.getElementById('detailMe').textContent = `${(m.me / 2).toFixed(1)} ★`;
    document.getElementById('detailHer').textContent = `${(m.her / 2).toFixed(1)} ★`;
    document.getElementById('detailMeta').textContent = [m.year, ...(m.genres || [])].filter(Boolean).join(' • ');
    document.getElementById('detailDescription').textContent = m.description || '';
    document.getElementById('detailDescription').style.display = m.description ? 'block' : 'none';
    document.getElementById('detailNote').textContent = m.note || 'Bez poznámky.';
    overlay.classList.add('active');
    detailSheet.classList.remove('detail-opening');
    detailSheet.classList.add('active');
    void detailSheet.offsetWidth;
    detailSheet.classList.add('detail-opening');
    setTimeout(()=>detailSheet.classList.remove('detail-opening'),300);
  }

  document.getElementById('editMovie').addEventListener('click', () => { if(currentDetailIndex!==null) openEditAt(currentDetailIndex); });


  document.getElementById('cancelDelete').addEventListener('click',closeSheets);
  document.getElementById('confirmDelete').addEventListener('click',()=>{
    if(!pendingDelete)return;
    if(pendingDelete.type==='movie')movies.splice(pendingDelete.index,1);else watchlist.splice(pendingDelete.index,1);
    pendingDelete=null;renderList();renderWatchlist();renderHallOfFame();updateHeaderSummary();saveData();closeSheets();
  });
  renderList();
  renderWatchlist();
  renderHallOfFame();
  updateHeaderSummary();
</script>

</body>
</html>
