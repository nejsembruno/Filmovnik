<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmář</title>
<style>
  :root {
    --bg: #08080b;
    --card: #16161c;
    --card-border: rgba(255,255,255,0.06);
    --text: #ECECEF;
    --text-dim: #85868f;
    --gold: #C7AD6E;
    --gold-bright: #DCC28A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  .scene { position: relative; min-height: 100vh; isolation: isolate; }

  .starfield {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 45%, #0d0d10 0%, #08080b 65%);
  }
  .dust { position: absolute; inset: -20px; filter: blur(1.4px); opacity: 0.4; }
  .dust span { position: absolute; width: 2px; height: 2px; background: #cfcfd6; border-radius: 50%; }
  .stars-layer { position: absolute; inset: 0; filter: blur(0.3px); }
  .star {
    position: absolute; width: 9px; height: 9px; background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.8;
  }
  .star.sm { width: 5px; height: 5px; opacity: 0.55; }
  .star.lg { width: 12px; height: 12px; opacity: 0.9; }

  .content { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 28px 18px 130px; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 4px 26px; }
  header h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }

  .view { display: none; }
  .view.active { display: block; }

  .movie-list, .watch-list { display: flex; flex-direction: column; gap: 10px; }

  .movie-row {
    display: flex; gap: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 10px; align-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .poster {
    width: 56px; height: 84px; border-radius: 8px; flex-shrink: 0;
    background-size: cover; background-position: center; background-color: #1e1e24;
  }
  .movie-info { flex: 1; min-width: 0; }
  .movie-info h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ratings { display: flex; gap: 16px; margin-top: 6px; }
  .rating { font-size: 12px; color: var(--text-dim); }
  .rating strong { color: var(--gold-bright); font-size: 15px; font-weight: 700; margin-right: 3px; }

  .watch-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 12px 14px;
  }
  .watch-check {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--text-dim); background: none; padding: 0;
  }
  .watch-check:active { transform: scale(0.9); }
  .watch-info { flex: 1; min-width: 0; }
  .watch-title { font-size: 15px; font-weight: 600; }
  .watch-tags { display: flex; gap: 6px; margin-top: 6px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 999px; margin-top: 2px;
  }
  .badge-watching { color: #16130a; background: var(--gold-bright); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .movie-row.enter, .watch-row.enter { animation: rowIn 0.3s ease-out; }

  .fab {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: var(--gold); color: #16130a; font-weight: 600; font-size: 14px;
    padding: 14px 22px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(199,173,110,0.22); border: none;
  }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-width: 480px; margin: 0 auto; display: flex;
    background: #131318; border-top: 1px solid var(--card-border);
    padding: 10px 0 22px;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text-dim); font-size: 11px; font-weight: 600;
    font-family: inherit;
  }
  .tab-btn.active { color: var(--gold-bright); }

  /* --- bottom sheets --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 480px; margin: 0 auto;
    background: #131318; border-radius: 20px 20px 0 0;
    border: 1px solid var(--card-border);
    padding: 8px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    max-height: 85vh; overflow-y: auto;
  }
  .sheet.active { transform: translateY(0); }

  .sheet-close {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 10px 0 16px; background: none; border: none;
  }
  .sheet-close svg { display: block; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .field input[type="text"], .field input[type="url"], .field textarea {
    width: 100%; background: #1b1b21; border: 1px solid var(--card-border);
    border-radius: 10px; padding: 11px 12px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: none; min-height: 60px; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #1b1b21; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px;
  }
  .switch-row span { font-size: 14px; }
  .switch-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }

  /* --- star slider --- */
  .rating-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .rating-label-row label { margin-bottom: 0; }
  .star-value { font-size: 15px; font-weight: 700; color: var(--gold-bright); }

  .star-slider { position: relative; width: 100%; }
  .stars-row { display: flex; justify-content: space-between; width: 100%; }
  .star-cell { position: relative; width: 18%; aspect-ratio: 1/1; }
  .star-shape {
    position: absolute; inset: 0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .star-bg { background: #2c2c33; }
  .star-fill-clip { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); transition: clip-path 0.18s ease-out; }
  .star-fill-clip .star-shape { position: absolute; width: 100%; height: 100%; }

  @keyframes starTap { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .star-cell.tap { animation: starTap 0.25s ease-out; transform-origin: center; }

  .star-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }

  /* --- kategorie --- */
  .segmented { position: relative; display: flex; background: #1b1b21; border-radius: 10px; padding: 4px; border: 1px solid var(--card-border); }
  .segment-indicator {
    position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
    background: var(--gold); border-radius: 8px;
    transition: transform 0.28s cubic-bezier(.4,0,.2,1); z-index: 0;
  }
  .segment {
    position: relative; z-index: 1; flex: 1; text-align: center; padding: 10px 0; border: none; background: transparent;
    color: var(--text-dim); font-size: 14px; font-weight: 600; border-radius: 8px; font-family: inherit;
    transition: color 0.2s ease-out;
  }
  .segment.active { color: #16130a; }

  .sheet-btn {
    width: 100%; background: var(--gold); color: #16130a; font-weight: 600; font-size: 15px;
    padding: 14px; border-radius: 12px; border: none; margin-top: 8px;
  }
  .sheet-btn-ghost {
    width: 100%; background: transparent; color: var(--text); font-weight: 600; font-size: 15px;
    padding: 13px; border-radius: 12px; border: 1px solid var(--card-border); margin-top: 10px;
  }

  .detail-poster {
    width: 100%; aspect-ratio: 2/3; max-height: 320px; border-radius: 14px;
    background-size: cover; background-position: center; background-color: #1e1e24; margin-bottom: 16px;
  }
  .detail-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
  .detail-ratings { display: flex; gap: 24px; margin-bottom: 16px; }
  .detail-ratings .rating strong { font-size: 20px; }
  .detail-note { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

  /* --- mobile-first polish --- */
  body { background:#08080b; }
  .content { max-width:430px; padding:22px 14px 126px; }
  header { display:block; padding:10px 4px 20px; }
  header h1 { font-size:32px; line-height:1.05; }
  .header-meta { color:var(--text-dim); font-size:12px; margin-top:7px; }
  .movie-list, .watch-list { gap:9px; }
  .swipe-wrap { position:relative; border-radius:14px; overflow:hidden; }
  .swipe-bg { position:absolute; inset:0; display:flex; align-items:center; pointer-events:none; opacity:0; transition:opacity .12s ease; }
  .swipe-bg.delete { justify-content:flex-end; padding-right:20px; background:linear-gradient(90deg,transparent 48%,rgba(166,62,69,.08) 74%,rgba(166,62,69,.19)); color:#d98b91; }
  .swipe-bg.edit { justify-content:flex-start; padding-left:20px; background:linear-gradient(270deg,transparent 48%,rgba(199,173,110,.07) 74%,rgba(199,173,110,.17)); color:var(--gold-bright); }
  .swipe-icon { width:19px; height:19px; opacity:.9; }
  .movie-row,.watch-row { position:relative; z-index:1; width:100%; min-height:102px; background:#15151b; will-change:transform; touch-action:pan-y; transition:transform .24s cubic-bezier(.2,.8,.2,1), background .2s ease; }
  .watch-row { min-height:66px; }
  .poster { width:56px; height:82px; }
  .movie-info h3,.watch-title { font-size:15px; }
  .ratings { gap:13px; margin-top:8px; }
  .rating-stars { color:var(--gold-bright); font-size:13px; letter-spacing:1px; white-space:nowrap; }
  .rating-person { color:var(--text-dim); font-size:10px; margin-left:5px; }
  .fab { bottom:88px; min-width:64px; height:48px; padding:0 20px; border:1px solid rgba(255,255,255,.1); background:rgba(25,25,31,.88); color:var(--gold-bright); font-size:25px; font-weight:400; box-shadow:0 10px 28px rgba(0,0,0,.34); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .tabbar { max-width:430px; padding:9px 0 calc(12px + env(safe-area-inset-bottom)); background:rgba(19,19,24,.94); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .sheet { max-width:430px; padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
  .detail-poster { max-height:300px; }
  .match-card { display:flex; align-items:center; justify-content:space-between; background:#1b1b21; border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; margin:0 0 16px; }
  .match-card span { color:var(--text-dim); font-size:12px; }
  .match-card strong { color:var(--gold-bright); font-size:18px; }
  .confirm-sheet { text-align:center; padding-left:22px; padding-right:22px; }
  .confirm-icon { width:42px; height:42px; display:grid; place-items:center; margin:4px auto 14px; border-radius:50%; background:rgba(166,62,69,.11); color:#d98b91; }
  .confirm-sheet h2 { font-size:19px; margin-bottom:7px; }
  .confirm-copy { color:var(--text-dim); font-size:13px; line-height:1.45; margin-bottom:18px; }
  .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .confirm-btn { min-height:46px; border-radius:12px; font:600 14px inherit; }
  .confirm-cancel { background:#1b1b21; color:var(--text); border:1px solid var(--card-border); }
  .confirm-delete { background:rgba(166,62,69,.14); color:#e1a0a5; border:1px solid rgba(166,62,69,.2); }
  @media (min-width:600px) { .content { padding-top:34px; } }

</style>
</head>
<body>

<div class="scene">
  <div class="starfield">
    <div class="dust" id="dust"></div>
    <div class="stars-layer" id="stars"></div>
  </div>

  <div class="content">
    <header><h1>Filmář</h1><div class="header-meta" id="headerMeta"></div></header>

    <div class="view active" id="viewRated">
      <div class="movie-list" id="movieList"></div>
    </div>

    <div class="view" id="viewWatchlist">
      <div class="watch-list" id="watchlistList"></div>
    </div>
  </div>

  <button class="fab" id="openAdd" aria-label="Přidat">＋</button>

  <div class="tabbar">
    <button class="tab-btn active" id="tabRated">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.7z" fill="currentColor"/></svg>
      Hodnocené
    </button>
    <button class="tab-btn" id="tabWatch">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3h12v18l-6-4.2L6 21V3z" fill="currentColor"/></svg>
      Watchlist
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- sheet: přidat / upravit hodnocený film -->
<div class="sheet" id="addSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <input type="text" id="inpTitle" placeholder="např. Perfect Days">
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="categoryToggle">
      <div class="segment-indicator" id="categoryIndicator"></div>
      <button type="button" class="segment active" data-value="film">Film</button>
      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>
  </div>
  <div class="field">
    <label>URL plakátu</label>
    <input type="url" id="inpPoster" placeholder="https://...">
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Brunovo hodnocení</label><span class="star-value" id="valMe">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starMe"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingMe"></div>
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Zuzčino hodnocení</label><span class="star-value" id="valHer">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starHer"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingHer"></div>
  </div>
  <div class="field">
    <label>Poznámka (nepovinné)</label>
    <textarea id="inpNote" placeholder="Pár slov k filmu..."></textarea>
  </div>
  <button class="sheet-btn" id="saveMovie">Uložit film</button>
</div>

<!-- sheet: přidat na watchlist -->
<div class="sheet" id="watchAddSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <input type="text" id="inpWatchTitle" placeholder="např. Poslední z nás">
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="watchCategoryToggle">
      <div class="segment-indicator" id="watchCategoryIndicator"></div>
      <button type="button" class="segment active" data-value="film">Film</button>
      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>
  </div>
  <div class="field" id="watchingField" style="display:none;">
    <label class="switch-row">
      <span>Sledujeme teď</span>
      <input type="checkbox" id="inpWatching">
    </label>
  </div>
  <button class="sheet-btn" id="saveWatch">Přidat na watchlist</button>
</div>

<!-- sheet: detail hodnoceného filmu -->
<div class="sheet" id="detailSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="detail-poster" id="detailPoster"></div>
  <div class="detail-title" id="detailTitle"></div>
  <span class="badge" id="detailBadge"></span>
  <div class="detail-ratings" style="margin-top:14px;">
    <span class="rating"><strong id="detailMe"></strong>Bruno</span>
    <span class="rating"><strong id="detailHer"></strong>Zuzi</span>
  </div>
  <div class="match-card"><span>Shoda hodnocení</span><strong id="detailMatch">–</strong></div><div class="detail-note" id="detailNote"></div>
  <button class="sheet-btn-ghost" id="editMovie">Upravit</button>
</div>


<!-- sheet: potvrzení smazání -->
<div class="sheet confirm-sheet" id="confirmSheet">
  <button class="sheet-close" data-close aria-label="Zavřít"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="confirm-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2>Smazat položku?</h2>
  <div class="confirm-copy" id="confirmCopy"></div>
  <div class="confirm-actions"><button class="confirm-btn confirm-cancel" id="cancelDelete">Zrušit</button><button class="confirm-btn confirm-delete" id="confirmDelete">Smazat</button></div>
</div>
<script>
  // --- hvězdné pozadí ---
  const starPositions = [
    [5,3,'sm'],[20,5,'lg'],[42,4,'md'],[68,5,'md'],[80,8,'sm'],[95,3,'sm'],
    [3,10,'sm'],[92,14,'md'],[2,26,'sm'],[97,30,'md'],[3,45,'sm'],[96,42,'lg'],
    [2,60,'sm'],[95,58,'md'],[3,75,'sm'],[93,72,'md'],
    [8,92,'md'],[22,96,'sm'],[42,99,'sm'],[58,97,'md'],[73,94,'sm'],[88,90,'lg'],
    [13,86,'sm'],[46,88,'sm']
  ];
  const starsBg = document.getElementById('stars');
  starPositions.forEach(([x,y,size]) => {
    const el = document.createElement('div');
    el.className = 'star' + (size === 'sm' ? ' sm' : size === 'lg' ? ' lg' : '');
    el.style.left = x + '%'; el.style.top = y + '%';
    starsBg.appendChild(el);
  });
  const dust = document.getElementById('dust');
  let dustHtml = '';
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 100, y = Math.random() * 100, s = Math.random() * 1.4 + 0.5;
    dustHtml += `<span style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;opacity:${Math.random()*0.4+0.15}"></span>`;
  }
  dust.innerHTML = dustHtml;

  // --- star rating slider ---
  function starColor(t) {
    const from = [212, 208, 199], to = [230, 175, 55];
    const r = Math.round(from[0] + (to[0]-from[0])*t);
    const g = Math.round(from[1] + (to[1]-from[1])*t);
    const b = Math.round(from[2] + (to[2]-from[2])*t);
    return `rgb(${r},${g},${b})`;
  }
  function buildStarSlider(containerId) {
    const row = document.getElementById(containerId);
    for (let i = 0; i < 5; i++) {
      const cell = document.createElement('div');
      cell.className = 'star-cell';
      const bg = document.createElement('div');
      bg.className = 'star-shape star-bg';
      const fillClip = document.createElement('div');
      fillClip.className = 'star-fill-clip';
      fillClip.dataset.index = i;
      const fillShape = document.createElement('div');
      fillShape.className = 'star-shape';
      fillShape.style.background = starColor(i / 4);
      fillClip.appendChild(fillShape);
      cell.appendChild(bg);
      cell.appendChild(fillClip);
      row.appendChild(cell);
    }
  }
  function updateStarSlider(containerId, value) {
    const row = document.getElementById(containerId);
    row.querySelectorAll('.star-fill-clip').forEach(clip => {
      const i = parseInt(clip.dataset.index);
      const frac = Math.max(0, Math.min(1, value - i));
      clip.style.clipPath = `inset(0 ${(1 - frac) * 100}% 0 0)`;
    });
  }
  buildStarSlider('starMe');
  buildStarSlider('starHer');
  updateStarSlider('starMe', 3.5);
  updateStarSlider('starHer', 3.5);

  const rMe = document.getElementById('inpRatingMe');
  const rHer = document.getElementById('inpRatingHer');
  function tap(containerId, value) {
    const row = document.getElementById(containerId);
    const idx = Math.min(4, Math.max(0, Math.ceil(value) - 1));
    const cell = row.querySelectorAll('.star-cell')[idx];
    cell.classList.remove('tap'); void cell.offsetWidth; cell.classList.add('tap');
  }
  rMe.addEventListener('input', () => {
    updateStarSlider('starMe', parseFloat(rMe.value));
    document.getElementById('valMe').textContent = rMe.value;
    tap('starMe', parseFloat(rMe.value));
  });
  rHer.addEventListener('input', () => {
    updateStarSlider('starHer', parseFloat(rHer.value));
    document.getElementById('valHer').textContent = rHer.value;
    tap('starHer', parseFloat(rHer.value));
  });

  // --- kategorie: hodnocené sheet ---
  const categoryLabels = { film: 'Film', serial: 'Seriál' };
  let selectedCategory = 'film';
  const categoryIndicator = document.getElementById('categoryIndicator');
  function setCategoryUI(value) {
    selectedCategory = value;
    document.querySelectorAll('#categoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    categoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
  }
  document.querySelectorAll('#categoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => setCategoryUI(btn.dataset.value));
  });

  // --- kategorie: watchlist sheet ---
  let selectedWatchCategory = 'film';
  const watchCategoryIndicator = document.getElementById('watchCategoryIndicator');
  const watchingField = document.getElementById('watchingField');
  const inpWatching = document.getElementById('inpWatching');
  function setWatchCategoryUI(value) {
    selectedWatchCategory = value;
    document.querySelectorAll('#watchCategoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    watchCategoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
    watchingField.style.display = value === 'serial' ? 'block' : 'none';
    if (value !== 'serial') inpWatching.checked = false;
  }
  document.querySelectorAll('#watchCategoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => setWatchCategoryUI(btn.dataset.value));
  });

  // --- data ---
  let movies = JSON.parse(localStorage.getItem('filmarMovies') || 'null') || [
    { title: "Perfect Days", category: "film", poster: "", me: 8, her: 9, note: "Klidný, pomalý film o obyčejném životě, který má krásu v detailech." },
    { title: "Anora", category: "film", poster: "", me: 7, her: 7, note: "" },
    { title: "The Bear", category: "serial", poster: "", me: 9, her: 8, note: "" },
    { title: "Poor Things", category: "film", poster: "", me: 9, her: 6, note: "Vizuálně unikátní, ale ne pro každého." }
  ];
  let watchlist = JSON.parse(localStorage.getItem('filmarWatchlist') || 'null') || [
    { title: "Poslední z nás", category: "serial", watching: true },
    { title: "Duna: Část druhá", category: "film", watching: false }
  ];
  movies = movies.map((m,i) => ({...m, id:m.id || 'm'+Date.now()+i, me:m.me>5?m.me/2:m.me, her:m.her>5?m.her/2:m.her}));
  watchlist = watchlist.map((w,i) => ({...w, id:w.id || 'w'+Date.now()+i}));
  let editingIndex = null;
  let currentDetailIndex = null;

  const posterFallback = [
    "linear-gradient(160deg,#3a2f1f,#161217)",
    "linear-gradient(160deg,#1f2a3a,#12141c)",
    "linear-gradient(160deg,#2f1f2a,#141116)"
  ];

  
  const trashSvg = `<svg class="swipe-icon" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const editSvg = `<svg class="swipe-icon" viewBox="0 0 24 24" fill="none"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function starText(value) {
    const rounded = Math.round(Number(value));
    return '★'.repeat(rounded) + '☆'.repeat(5-rounded);
  }
  function persist() {
    localStorage.setItem('filmarMovies', JSON.stringify(movies));
    localStorage.setItem('filmarWatchlist', JSON.stringify(watchlist));
    updateHeader();
  }
  function updateHeader() {
    document.getElementById('headerMeta').textContent = `${movies.length} hodnoceno  •  ${watchlist.length} ve watchlistu`;
  }
  let pendingDelete = null;
  const confirmSheet = document.getElementById('confirmSheet');
  function askDelete(type, id, title) {
    pendingDelete = { type, id };
    document.getElementById('confirmCopy').textContent = `„${title}“ bude trvale odstraněno.`;
    overlay.classList.add('active');
    confirmSheet.classList.add('active');
  }
  function bindSwipe(el, onEdit, onDelete) {
    let startX = 0, startY = 0, dx = 0, dragging = false;
    const leftBg = el.parentElement.querySelector('.swipe-bg.edit');
    const rightBg = el.parentElement.querySelector('.swipe-bg.delete');
    el.addEventListener('pointerdown', e => { startX=e.clientX; startY=e.clientY; dx=0; dragging=true; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const moveX=e.clientX-startX, moveY=e.clientY-startY;
      if (Math.abs(moveY)>Math.abs(moveX) && Math.abs(moveY)>8) { dragging=false; el.style.transform=''; return; }
      dx=Math.max(-105,Math.min(105,moveX));
      if (!onEdit && dx>0) dx=0;
      el.style.transition='none'; el.style.transform=`translateX(${dx}px)`;
      leftBg.style.opacity=dx>12?Math.min(1,(dx-12)/58):0;
      rightBg.style.opacity=dx<-12?Math.min(1,(-dx-12)/58):0;
    });
    const finish=()=>{
      if (!dragging) return; dragging=false;
      el.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)'; el.style.transform=''; leftBg.style.opacity=0; rightBg.style.opacity=0;
      if (dx>72 && onEdit) onEdit();
      if (dx<-72 && onDelete) onDelete();
      dx=0;
    };
    el.addEventListener('pointerup',finish); el.addEventListener('pointercancel',finish);
  }

  function renderList(highlightFirst) {
    const list = document.getElementById('movieList');
    if (!movies.length) { list.innerHTML='<div class="empty-state">Zatím žádné filmy. Přidej první tlačítkem dole.</div>'; updateHeader(); return; }
    list.innerHTML = movies.map((m,i) => {
      const bg=m.poster?`background-image:url('${m.poster}')`:`background:${posterFallback[i%posterFallback.length]}`;
      return `<div class="swipe-wrap" data-wrap-id="${m.id}"><div class="swipe-bg edit">${editSvg}</div><div class="swipe-bg delete">${trashSvg}</div><div class="movie-row" data-id="${m.id}"><div class="poster" style="${bg}"></div><div class="movie-info"><h3>${m.title}</h3><span class="badge">${categoryLabels[m.category]||'Film'}</span><div class="ratings"><span><span class="rating-stars">${starText(m.me)}</span><span class="rating-person">Bruno</span></span><span><span class="rating-stars">${starText(m.her)}</span><span class="rating-person">Zuzi</span></span></div></div></div></div>`;
    }).join('');
    if (highlightFirst) list.querySelector('.movie-row')?.classList.add('enter');
    list.querySelectorAll('.movie-row').forEach(row=>{
      const id=row.dataset.id, index=movies.findIndex(m=>m.id===id), item=movies[index];
      row.addEventListener('click',()=>openDetail(index));
      bindSwipe(row,()=>openEdit(index),()=>askDelete('movie',id,item.title));
    });
    updateHeader();
  }
  function renderWatchlist(highlightFirst) {
    const list=document.getElementById('watchlistList');
    if (!watchlist.length) { list.innerHTML='<div class="empty-state">Watchlist je prázdný. Přidej první tip tlačítkem dole.</div>'; updateHeader(); return; }
    list.innerHTML=watchlist.map(w=>`<div class="swipe-wrap"><div class="swipe-bg edit"></div><div class="swipe-bg delete">${trashSvg}</div><div class="watch-row" data-id="${w.id}"><button class="watch-check" data-check="${w.id}" aria-label="Přesunout do hodnocených"></button><div class="watch-info"><div class="watch-title">${w.title}</div><div class="watch-tags"><span class="badge">${categoryLabels[w.category]||'Film'}</span>${w.category==='serial'&&w.watching?'<span class="badge badge-watching">Sledujeme</span>':''}</div></div></div></div>`).join('');
    if (highlightFirst) list.querySelector('.watch-row')?.classList.add('enter');
    list.querySelectorAll('.watch-check').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();moveToRated(btn.dataset.check)}));
    list.querySelectorAll('.watch-row').forEach(row=>{const id=row.dataset.id,item=watchlist.find(w=>w.id===id);bindSwipe(row,null,()=>askDelete('watch',id,item.title));});
    updateHeader();
  }
  function moveToRated(id) {
    const index=watchlist.findIndex(w=>w.id===id), item=watchlist[index];
    watchlist.splice(index,1); persist(); renderWatchlist(); resetAddForm();
    document.getElementById('inpTitle').value=item.title; setCategoryUI(item.category);
    overlay.classList.add('active'); addSheet.classList.add('active');
  }

  // --- sheety ---
  const overlay = document.getElementById('overlay');
  const addSheet = document.getElementById('addSheet');
  const watchAddSheet = document.getElementById('watchAddSheet');
  const detailSheet = document.getElementById('detailSheet');

  function closeSheets() {
    overlay.classList.remove('active');
    addSheet.classList.remove('active');
    watchAddSheet.classList.remove('active');
    detailSheet.classList.remove('active');
    confirmSheet.classList.remove('active');
  }
  overlay.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', closeSheets));

  function resetAddForm() {
    document.getElementById('inpTitle').value = '';
    document.getElementById('inpPoster').value = '';
    document.getElementById('inpNote').value = '';
    setCategoryUI('film');
    rMe.value = 3.5; rHer.value = 3.5;
    updateStarSlider('starMe', 3.5); updateStarSlider('starHer', 3.5);
    document.getElementById('valMe').textContent = '3.5';
    document.getElementById('valHer').textContent = '3.5';
    editingIndex = null;
    document.getElementById('saveMovie').textContent = 'Uložit film';
  }
  function resetWatchForm() {
    document.getElementById('inpWatchTitle').value = '';
    setWatchCategoryUI('film');
  }

  // --- taby ---
  const tabRated = document.getElementById('tabRated');
  const tabWatch = document.getElementById('tabWatch');
  const viewRated = document.getElementById('viewRated');
  const viewWatchlist = document.getElementById('viewWatchlist');
  const fab = document.getElementById('openAdd');
  let activeTab = 'rated';
  function setTab(tab) {
    activeTab = tab;
    tabRated.classList.toggle('active', tab === 'rated');
    tabWatch.classList.toggle('active', tab === 'watch');
    viewRated.classList.toggle('active', tab === 'rated');
    viewWatchlist.classList.toggle('active', tab === 'watch');
  }
  tabRated.addEventListener('click', () => setTab('rated'));
  tabWatch.addEventListener('click', () => setTab('watch'));

  fab.addEventListener('click', () => {
    overlay.classList.add('active');
    if (activeTab === 'rated') { resetAddForm(); addSheet.classList.add('active'); }
    else { resetWatchForm(); watchAddSheet.classList.add('active'); }
  });

  document.getElementById('saveMovie').addEventListener('click', () => {
    const title = document.getElementById('inpTitle').value.trim();
    if (!title) return;
    const data = {
      title,
      category: selectedCategory,
      poster: document.getElementById('inpPoster').value.trim(),
      me: parseFloat(rMe.value),
      her: parseFloat(rHer.value),
      note: document.getElementById('inpNote').value.trim()
    };
    if (editingIndex !== null) {
      movies[editingIndex] = data;
      renderList(false);
    } else {
      movies.unshift(data);
      renderList(true);
    }
    persist();
    resetAddForm();
    closeSheets();
  });

  document.getElementById('saveWatch').addEventListener('click', () => {
    const title = document.getElementById('inpWatchTitle').value.trim();
    if (!title) return;
    watchlist.unshift({
      title,
      category: selectedWatchCategory,
      watching: selectedWatchCategory === 'serial' && inpWatching.checked
    });
    persist();
    resetWatchForm();
    renderWatchlist(true);
    closeSheets();
  });

  function openDetail(index) {
    currentDetailIndex = index;
    const m = movies[index];
    const posterEl = document.getElementById('detailPoster');
    posterEl.style.background = m.poster ? `url('${m.poster}') center/cover` : posterFallback[index % posterFallback.length];
    document.getElementById('detailTitle').textContent = m.title;
    document.getElementById('detailBadge').textContent = categoryLabels[m.category] || 'Film';
    document.getElementById('detailMe').textContent = Number(m.me).toFixed(1);
    document.getElementById('detailHer').textContent = Number(m.her).toFixed(1);
    document.getElementById('detailMatch').textContent = Math.round(100 - Math.abs(m.me-m.her)/5*100) + ' %';
    document.getElementById('detailNote').textContent = m.note || 'Bez poznámky.';
    overlay.classList.add('active');
    detailSheet.classList.add('active');
  }

  function openEdit(index) {
    const m = movies[index];
    editingIndex = index;
    document.getElementById('inpTitle').value = m.title;
    document.getElementById('inpPoster').value = m.poster;
    document.getElementById('inpNote').value = m.note;
    setCategoryUI(m.category);
    const meVal = m.me, herVal = m.her;
    rMe.value = meVal; rHer.value = herVal;
    updateStarSlider('starMe', meVal); updateStarSlider('starHer', herVal);
    document.getElementById('valMe').textContent = meVal;
    document.getElementById('valHer').textContent = herVal;
    document.getElementById('saveMovie').textContent = 'Uložit změny';
    detailSheet.classList.remove('active');
    confirmSheet.classList.remove('active');
    addSheet.classList.add('active');
  }
  document.getElementById('editMovie').addEventListener('click', () => { if (currentDetailIndex !== null) openEdit(currentDetailIndex); });


  document.getElementById('cancelDelete').addEventListener('click', closeSheets);
  document.getElementById('confirmDelete').addEventListener('click', () => {
    if (!pendingDelete) return;
    if (pendingDelete.type === 'movie') movies = movies.filter(m => m.id !== pendingDelete.id);
    else watchlist = watchlist.filter(w => w.id !== pendingDelete.id);
    pendingDelete = null; persist(); renderList(); renderWatchlist(); closeSheets();
  });
  updateHeader();
  renderList();
  renderWatchlist();
</script>

</body>
</html>
