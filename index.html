<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Filmovník</title>
<style>
  :root {
    --bg: #08080b;
    --card: #16161c;
    --card-border: rgba(255,255,255,0.06);
    --text: #ECECEF;
    --text-dim: #85868f;
    --gold: #C7AD6E;
    --gold-bright: #DCC28A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  .scene { position: relative; min-height: 100vh; isolation: isolate; }

  .starfield {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 45%, #0d0d10 0%, #08080b 65%);
  }
  .dust { position: absolute; inset: -20px; filter: blur(1.4px); opacity: 0.4; }
  .dust span { position: absolute; width: 2px; height: 2px; background: #cfcfd6; border-radius: 50%; }
  .stars-layer { position: absolute; inset: 0; filter: blur(0.3px); }
  .star {
    position: absolute; width: 9px; height: 9px; background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.8;
  }
  .star.sm { width: 5px; height: 5px; opacity: 0.55; }
  .star.lg { width: 12px; height: 12px; opacity: 0.9; }

  .content { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 28px 18px 130px; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 4px 26px; }
  header h1 { font-family: 'Courier New', Courier, monospace; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }

  .view { display: none; }
  .view.active { display: block; }

  .movie-list, .watch-list { display: flex; flex-direction: column; gap: 10px; }

  .movie-row {
    display: flex; gap: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 10px; align-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .poster {
    width: 56px; height: 84px; border-radius: 8px; flex-shrink: 0;
    background-size: cover; background-position: center; background-color: #1e1e24;
  }
  .movie-info { flex: 1; min-width: 0; }
  .movie-info h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ratings { display: flex; gap: 16px; margin-top: 6px; }
  .rating { font-size: 12px; color: var(--text-dim); }
  .rating strong { color: var(--gold-bright); font-size: 15px; font-weight: 700; margin-right: 3px; }

  .watch-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 12px 14px;
  }
  .watch-check {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--text-dim); background: none; padding: 0;
  }
  .watch-check:active { transform: scale(0.9); }
  .watch-info { flex: 1; min-width: 0; }
  .watch-title { font-size: 15px; font-weight: 600; }
  .watch-tags { display: flex; gap: 6px; margin-top: 6px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 999px; margin-top: 2px;
  }
  .badge-watching { color: #16130a; background: var(--gold-bright); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .movie-row.enter, .watch-row.enter { animation: rowIn 0.3s ease-out; }

  .fab {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: var(--gold); color: #16130a; font-weight: 600; font-size: 14px;
    padding: 14px 22px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(199,173,110,0.22); border: none;
  }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-width: 480px; margin: 0 auto; display: flex;
    background: #131318; border-top: 1px solid var(--card-border);
    padding: 10px 0 22px;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text-dim); font-size: 11px; font-weight: 600;
    font-family: inherit;
  }
  .tab-btn.active { color: var(--gold-bright); }

  /* --- bottom sheets --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 480px; margin: 0 auto;
    background: #131318; border-radius: 20px 20px 0 0;
    border: 1px solid var(--card-border);
    padding: 8px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    max-height: 85vh; overflow-y: auto;
  }
  .sheet.active { transform: translateY(0); }

  .sheet-close {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 10px 0 16px; background: none; border: none;
  }
  .sheet-close svg { display: block; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .field input[type="text"], .field input[type="url"], .field textarea {
    width: 100%; background: #1b1b21; border: 1px solid var(--card-border);
    border-radius: 10px; padding: 11px 12px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: none; min-height: 60px; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #1b1b21; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px;
  }
  .switch-row span { font-size: 14px; }
  .switch-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }

  /* --- star slider --- */
  .rating-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .rating-label-row label { margin-bottom: 0; }
  .star-value { font-size: 15px; font-weight: 700; color: var(--gold-bright); }

  .star-slider { position: relative; width: 100%; }
  .stars-row { display: flex; justify-content: space-between; width: 100%; }
  .star-cell { position: relative; width: 18%; aspect-ratio: 1/1; }
  .star-shape {
    position: absolute; inset: 0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .star-bg { background: #2c2c33; }
  .star-fill-clip { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); transition: clip-path 0.18s ease-out; }
  .star-fill-clip .star-shape { position: absolute; width: 100%; height: 100%; }

  @keyframes starTap { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .star-cell.tap { animation: starTap 0.25s ease-out; transform-origin: center; }

  .star-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }

  /* --- kategorie --- */
  .segmented { position: relative; display: flex; background: #1b1b21; border-radius: 10px; padding: 4px; border: 1px solid var(--card-border); }
  .segment-indicator {
    position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
    background: var(--gold); border-radius: 8px;
    transition: transform 0.28s cubic-bezier(.4,0,.2,1); z-index: 0;
  }
  .segment {
    position: relative; z-index: 1; flex: 1; text-align: center; padding: 10px 0; border: none; background: transparent;
    color: var(--text-dim); font-size: 14px; font-weight: 600; border-radius: 8px; font-family: inherit;
    transition: color 0.2s ease-out;
  }
  .segment.active { color: #16130a; }

  .sheet-btn {
    width: 100%; background: var(--gold); color: #16130a; font-weight: 600; font-size: 15px;
    padding: 14px; border-radius: 12px; border: none; margin-top: 8px;
  }
  .sheet-btn-ghost {
    width: 100%; background: transparent; color: var(--text); font-weight: 600; font-size: 15px;
    padding: 13px; border-radius: 12px; border: 1px solid var(--card-border); margin-top: 10px;
  }

  .detail-poster {
    width: min(62vw, 220px); aspect-ratio: 2/3; border-radius: 14px;
    background-size: cover; background-position: center; background-color: #1e1e24; margin: 0 auto 18px;
  }
  .detail-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
  .detail-ratings { display: flex; gap: 24px; margin-bottom: 16px; }
  .detail-ratings .rating strong { font-size: 20px; }
  .detail-note { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

  /* Mobile swipe actions */
  .swipe-shell { position:relative; overflow:hidden; border-radius:14px; }
  .swipe-hint { position:absolute; inset:0; display:flex; align-items:center; opacity:0; pointer-events:none; transition:opacity .12s ease; }
  .swipe-hint.edit { justify-content:flex-start; padding-left:20px; color:var(--gold-bright); background:linear-gradient(90deg,rgba(199,173,110,.16),rgba(199,173,110,.04) 48%,transparent 75%); }
  .swipe-hint.delete { justify-content:flex-end; padding-right:20px; color:#d58a90; background:linear-gradient(270deg,rgba(163,60,68,.17),rgba(163,60,68,.04) 48%,transparent 75%); }
  .swipe-hint svg { width:19px; height:19px; }
  .swipe-shell .movie-row,.swipe-shell .watch-row { position:relative; z-index:1; width:100%; touch-action:pan-y; will-change:transform; }
  .compact-rating { display:inline-flex; align-items:center; gap:4px; color:var(--gold-bright); font-size:14px; font-weight:700; }
  .compact-rating .rating-name { color:var(--text-dim); font-size:11px; font-weight:500; margin-left:2px; }
  .confirm-sheet { text-align:center; }
  .confirm-sheet h2 { font-size:19px; margin:4px 0 8px; }
  .confirm-sheet p { color:var(--text-dim); font-size:13px; line-height:1.45; margin-bottom:18px; }
  .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .confirm-actions button { min-height:46px; border-radius:12px; font:600 14px inherit; }
  .confirm-cancel { background:#1b1b21; color:var(--text); border:1px solid var(--card-border); }
  .confirm-delete { background:rgba(163,60,68,.14); color:#e2a0a5; border:1px solid rgba(163,60,68,.22); }


  .tmdb-status { min-height:18px; margin-top:7px; color:var(--text-dim); font-size:11px; line-height:1.4; }
  .tmdb-status.ok { color:var(--gold-bright); }
  .detail-meta { color:var(--text-dim); font-size:12px; line-height:1.5; margin:7px 0 14px; }
  .detail-description { color:var(--text-dim); font-size:13px; line-height:1.55; margin-bottom:16px; }


  .watch-poster { width:42px; height:63px; border-radius:7px; flex-shrink:0; background-size:cover; background-position:center; background-color:#1e1e24; }
  .watch-meta { color:var(--text-dim); font-size:11px; line-height:1.35; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .detail-ratings .rating strong { display:inline-flex; align-items:center; gap:4px; color:var(--gold-bright); }


  .autocomplete-wrap { position:relative; }
  .suggestions { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30; display:none; overflow:hidden; background:#1b1b21; border:1px solid rgba(255,255,255,.09); border-radius:12px; box-shadow:0 14px 34px rgba(0,0,0,.42); }
  .suggestions.active { display:block; }
  .suggestion { width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border:0; border-bottom:1px solid rgba(255,255,255,.05); background:transparent; color:var(--text); text-align:left; font-family:inherit; }
  .suggestion:last-child { border-bottom:0; }
  .suggestion:active,.suggestion.selected { background:rgba(199,173,110,.10); }
  .suggestion-poster { width:32px; height:48px; flex:0 0 auto; border-radius:5px; background:#25252c center/cover no-repeat; }
  .suggestion-info { min-width:0; flex:1; }
  .suggestion-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:600; }
  .suggestion-meta { display:block; margin-top:4px; color:var(--text-dim); font-size:11px; }
  .suggestion-empty { padding:12px; color:var(--text-dim); font-size:12px; }


  #detailSheet.dragging { transition:none; overflow-y:hidden; }
  #detailSheet .sheet-close { touch-action:none; cursor:grab; user-select:none; }
  #detailSheet .sheet-close:active { cursor:grabbing; }


  /* Mobile app shell: scrolluje jen aktivní seznam, ne celá stránka */
  html, body { width:100%; height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  body { position:fixed; inset:0; touch-action:pan-x pan-y; }
  .content { height:100dvh; max-width:480px; display:flex; flex-direction:column; overflow:hidden; padding:calc(18px + env(safe-area-inset-top)) 18px 0; }
  header { flex:0 0 auto; padding:8px 4px 18px; }
  .view { min-height:0; flex:1 1 auto; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:calc(132px + env(safe-area-inset-bottom)); }
  .view::-webkit-scrollbar { display:none; }
  .view.active { display:block; }

  /* Lehká mobilní navigace bez plného panelu */
  .tabbar { max-width:480px; justify-content:center; gap:54px; padding:24px 24px calc(15px + env(safe-area-inset-bottom)); background:linear-gradient(to top,rgba(8,8,11,.98) 18%,rgba(8,8,11,.82) 48%,rgba(8,8,11,0)); border-top:0; pointer-events:none; }
  .tab-btn { flex:0 0 56px; height:48px; justify-content:flex-end; gap:0; font-size:0; pointer-events:auto; filter:drop-shadow(0 4px 12px rgba(0,0,0,.45)); }
  .tab-btn svg { width:28px; height:28px; }
  .tab-btn.active svg { filter:drop-shadow(0 0 8px rgba(230,195,105,.24)); }

  /* Větší a spolehlivější dotyková plocha hodnocení */
  .star-slider { min-height:64px; display:flex; align-items:center; touch-action:none; user-select:none; -webkit-user-select:none; cursor:ew-resize; }
  .stars-row { pointer-events:none; }
  .star-cell { width:18%; max-height:58px; }
  .star-input { pointer-events:none; height:64px; }


  .header-summary { margin-top:6px; color:var(--text-dim); font-size:12px; font-family:system-ui,-apple-system,sans-serif; font-weight:500; letter-spacing:0; }

  /* Bezpečná vzdálenost FAB od home indikátoru */
  .fab { bottom:calc(92px + env(safe-area-inset-bottom)); }

  /* Uzamčení seznamu, když je otevřený sheet */
  body.sheet-open .view { overflow:hidden !important; touch-action:none; }

  /* Krátké potvrzení po uložení */
  .save-toast { position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:15; transform:translate(-50%,14px); padding:9px 14px; border:1px solid rgba(199,173,110,.18); border-radius:999px; background:rgba(27,27,33,.92); color:var(--gold-bright); font-size:12px; font-weight:650; opacity:0; pointer-events:none; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:opacity .18s ease,transform .22s ease; box-shadow:0 8px 24px rgba(0,0,0,.28); }
  .save-toast.show { opacity:1; transform:translate(-50%,0); }

  /* Skeleton výsledky TMDB */
  .suggestion-skeleton { display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.05); }
  .suggestion-skeleton:last-child { border-bottom:0; }
  .skeleton-poster,.skeleton-line { background:linear-gradient(100deg,#25252c 20%,#303038 38%,#25252c 56%); background-size:220% 100%; animation:skeletonPulse 1.15s ease-in-out infinite; }
  .skeleton-poster { width:32px; height:48px; flex:0 0 auto; border-radius:5px; }
  .skeleton-copy { flex:1; }
  .skeleton-line { height:9px; border-radius:5px; margin:4px 0; }
  .skeleton-line.short { width:48%; }
  @keyframes skeletonPulse { to { background-position:-120% 0; } }
  @media (prefers-reduced-motion:reduce) { .skeleton-poster,.skeleton-line { animation:none; } }


  /* Subtilní mobilní animace */
  .view.view-exit-left { animation:viewExitLeft .14s ease both; }
  .view.view-exit-right { animation:viewExitRight .14s ease both; }
  .view.view-enter-left { animation:viewEnterLeft .18s cubic-bezier(.2,.75,.25,1) both; }
  .view.view-enter-right { animation:viewEnterRight .18s cubic-bezier(.2,.75,.25,1) both; }
  @keyframes viewExitLeft { to { opacity:0; transform:translateX(-10px); } }
  @keyframes viewExitRight { to { opacity:0; transform:translateX(10px); } }
  @keyframes viewEnterLeft { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
  @keyframes viewEnterRight { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:none; } }

  .movie-row.card-press { animation:cardPress .15s ease both; }
  @keyframes cardPress { 50% { transform:scale(.975); } 100% { transform:scale(1); } }

  .movie-row.enter,.watch-row.enter { animation:newCardIn .24s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes newCardIn { from { opacity:0; transform:translateY(-8px) scale(.97); } to { opacity:1; transform:none; } }

  .suggestion.suggestion-in { animation:suggestionIn .18s cubic-bezier(.2,.75,.25,1) both; }
  @keyframes suggestionIn { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }

  .save-toast::after { content:' ✓'; display:inline-block; animation:checkPop .24s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes checkPop { from { opacity:0; transform:scale(.3); } to { opacity:1; transform:scale(1); } }

  #detailSheet.detail-opening { animation:detailSettle .28s cubic-bezier(.2,.82,.2,1) both; }
  @keyframes detailSettle { from { opacity:.72; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion:reduce) {
    .view.view-exit-left,.view.view-exit-right,.view.view-enter-left,.view.view-enter-right,
    .movie-row.card-press,.movie-row.enter,.watch-row.enter,.suggestion.suggestion-in,
    .save-toast::after,#detailSheet.detail-opening { animation:none !important; }
  }

</style>
</head>
<body>

<div class="scene">
  <div class="starfield">
    <div class="dust" id="dust"></div>
    <div class="stars-layer" id="stars"></div>
  </div>

  <div class="content">
    <header><div><h1>Filmovník</h1><div class="header-summary" id="headerSummary">0 hodnoceno • 0 ve watchlistu</div></div></header>

    <div class="view active" id="viewRated">
      <div class="movie-list" id="movieList"></div>
    </div>

    <div class="view" id="viewWatchlist">
      <div class="watch-list" id="watchlistList"></div>
    </div>
  </div>

  <button class="fab" id="openAdd">+ Přidat film</button>

  <div class="save-toast" id="saveToast" role="status" aria-live="polite">Uloženo</div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabRated">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.7z" fill="currentColor"/></svg>
      Hodnocené
    </button>
    <button class="tab-btn" id="tabWatch">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3h12v18l-6-4.2L6 21V3z" fill="currentColor"/></svg>
      Watchlist
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- sheet: přidat / upravit hodnocený film -->
<div class="sheet" id="addSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <div class="autocomplete-wrap"><input type="text" id="inpTitle" placeholder="Začni psát název…" autocomplete="off"><div class="suggestions" id="titleSuggestions"></div></div>
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="categoryToggle">
      <div class="segment-indicator" id="categoryIndicator"></div>
      <button type="button" class="segment active" data-value="film">Film</button>
      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>
  </div>
  <div class="field">
    <label>URL plakátu</label>
    <input type="url" id="inpPoster" placeholder="Doplní se automaticky z TMDB"><div class="tmdb-status" id="tmdbStatus"></div>
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Brunovo hodnocení</label><span class="star-value" id="valMe">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starMe"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingMe"></div>
  </div>
  <div class="field">
    <div class="rating-label-row"><label>Zuzčino hodnocení</label><span class="star-value" id="valHer">3.5</span></div>
    <div class="star-slider"><div class="stars-row" id="starHer"></div>
      <input type="range" min="0.5" max="5" step="0.5" value="3.5" class="star-input" id="inpRatingHer"></div>
  </div>
  <div class="field">
    <label>Poznámka (nepovinné)</label>
    <textarea id="inpNote" placeholder="Pár slov k filmu..."></textarea>
  </div>
  <button class="sheet-btn" id="saveMovie">Uložit film</button>
</div>

<!-- sheet: přidat na watchlist -->
<div class="sheet" id="watchAddSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="field">
    <label>Název</label>
    <div class="autocomplete-wrap"><input type="text" id="inpWatchTitle" placeholder="Začni psát název…" autocomplete="off"><div class="suggestions" id="watchSuggestions"></div></div>
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="segmented" id="watchCategoryToggle">
      <div class="segment-indicator" id="watchCategoryIndicator"></div>

      <button type="button" class="segment" data-value="serial">Seriál</button>
    </div>

  <div class="field" id="watchingField" style="display:none;">

      <span>Sledujeme teď</span>

<!-- sheet: detail hodnoceného filmu -->
<div class="sheet" id="detailSheet">
  <button class="sheet-close" data-close>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="detail-poster" id="detailPoster"></div>
  <div class="detail-title" id="detailTitle"></div>
  <span class="badge" id="detailBadge"></span><div class="detail-meta" id="detailMeta"></div><div class="detail-description" id="detailDescription"></div>
  <div class="detail-ratings" style="margin-top:14px;">
    <span class="rating"><strong id="detailMe"></strong>Bruno</span>
    <span class="rating"><strong id="detailHer"></strong>Zuzi</span>
  </div>
  <div class="detail-note" id="detailNote"></div>
  <button class="sheet-btn-ghost" id="editMovie">Upravit</button>

<div class="sheet confirm-sheet" id="confirmSheet">
  <button class="sheet-close" data-close aria-label="Zavřít"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7L10 13L16 7" stroke="#6b6c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h2>Smazat položku?</h2>
  <p id="confirmText"></p>
  <div class="confirm-actions">
    <button class="confirm-cancel" id="cancelDelete">Zrušit</button>
    <button class="confirm-delete" id="confirmDelete">Smazat</button>
  </div>
</div>
<script>

  function haptic(pattern = 8) {
    try { if ('vibrate' in navigator) navigator.vibrate(pattern); } catch (e) {}
  }


  const TMDB_API_KEY = '0899dead6866fb139e5cb434f0863ab5';
  const TMDB_BASE = 'https://api.themoviedb.org/3';
  const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
  let pendingTmdbData = null;
  const tmdbGenreCache = { movie: null, tv: null };

  async function getTmdbGenres(type) {
    if (tmdbGenreCache[type]) return tmdbGenreCache[type];
    const response = await fetch(`${TMDB_BASE}/genre/${type}/list?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ`);
    if (!response.ok) throw new Error('genre');
    const data = await response.json();
    tmdbGenreCache[type] = Object.fromEntries((data.genres || []).map(g => [g.id, g.name]));
    return tmdbGenreCache[type];
  }

  async function loadTmdbData(title, category, force = false) {
    const status = document.getElementById('tmdbStatus');
    if (!title) return null;
    if (!force && pendingTmdbData?.query === title && pendingTmdbData?.category === category) return pendingTmdbData;
    if (status) { status.className = 'tmdb-status'; status.textContent = 'Hledám údaje na TMDB…'; }
    try {
      const type = category === 'serial' ? 'tv' : 'movie';
      const response = await fetch(`${TMDB_BASE}/search/${type}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ&query=${encodeURIComponent(title)}&include_adult=false`);
      if (!response.ok) throw new Error('search');
      const data = await response.json();
      const found = data.results?.[0];
      if (!found) { if (status) status.textContent = 'Na TMDB nenalezeno. Můžeš uložit ručně.'; pendingTmdbData = null; return null; }
      const genreMap = await getTmdbGenres(type);
      const releaseDate = category === 'serial' ? found.first_air_date : found.release_date;
      pendingTmdbData = {
        query: title,
        category,
        tmdbId: found.id,
        poster: found.poster_path ? TMDB_IMAGE_BASE + found.poster_path : '',
        genres: (found.genre_ids || []).map(id => genreMap[id]).filter(Boolean),
        year: releaseDate ? releaseDate.slice(0,4) : '',
        description: found.overview || ''
      };
      const posterInput = document.getElementById('inpPoster');
      if (!posterInput.value.trim() && pendingTmdbData.poster) posterInput.value = pendingTmdbData.poster;
      if (status) { status.className = 'tmdb-status ok'; status.textContent = ['Nalezeno', pendingTmdbData.year, pendingTmdbData.genres.join(' • ')].filter(Boolean).join(': ').replace(': :', ': '); }
      return pendingTmdbData;
    } catch (error) {
      if (status) status.textContent = 'TMDB údaje se nepodařilo načíst. Položku můžeš uložit i bez nich.';
      pendingTmdbData = null;
      return null;
    }
  }

  // --- hvězdné pozadí ---
  const starPositions = [
    [5,3,'sm'],[20,5,'lg'],[42,4,'md'],[68,5,'md'],[80,8,'sm'],[95,3,'sm'],
    [3,10,'sm'],[92,14,'md'],[2,26,'sm'],[97,30,'md'],[3,45,'sm'],[96,42,'lg'],
    [2,60,'sm'],[95,58,'md'],[3,75,'sm'],[93,72,'md'],
    [8,92,'md'],[22,96,'sm'],[42,99,'sm'],[58,97,'md'],[73,94,'sm'],[88,90,'lg'],
    [13,86,'sm'],[46,88,'sm']
  ];
  const starsBg = document.getElementById('stars');
  starPositions.forEach(([x,y,size]) => {
    const el = document.createElement('div');
    el.className = 'star' + (size === 'sm' ? ' sm' : size === 'lg' ? ' lg' : '');
    el.style.left = x + '%'; el.style.top = y + '%';
    starsBg.appendChild(el);
  });
  const dust = document.getElementById('dust');
  let dustHtml = '';
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 100, y = Math.random() * 100, s = Math.random() * 1.4 + 0.5;
    dustHtml += `<span style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;opacity:${Math.random()*0.4+0.15}"></span>`;
  }
  dust.innerHTML = dustHtml;

  // --- star rating slider ---
  function starColor(t) {
    const from = [212, 208, 199], to = [230, 175, 55];
    const r = Math.round(from[0] + (to[0]-from[0])*t);
    const g = Math.round(from[1] + (to[1]-from[1])*t);
    const b = Math.round(from[2] + (to[2]-from[2])*t);
    return `rgb(${r},${g},${b})`;
  }
  function buildStarSlider(containerId) {
    const row = document.getElementById(containerId);
    for (let i = 0; i < 5; i++) {
      const cell = document.createElement('div');
      cell.className = 'star-cell';
      const bg = document.createElement('div');
      bg.className = 'star-shape star-bg';
      const fillClip = document.createElement('div');
      fillClip.className = 'star-fill-clip';
      fillClip.dataset.index = i;
      const fillShape = document.createElement('div');
      fillShape.className = 'star-shape';
      fillShape.style.background = starColor(i / 4);
      fillClip.appendChild(fillShape);
      cell.appendChild(bg);
      cell.appendChild(fillClip);
      row.appendChild(cell);
    }
  }
  function updateStarSlider(containerId, value) {
    const row = document.getElementById(containerId);
    row.querySelectorAll('.star-fill-clip').forEach(clip => {
      const i = parseInt(clip.dataset.index);
      const frac = Math.max(0, Math.min(1, value - i));
      clip.style.clipPath = `inset(0 ${(1 - frac) * 100}% 0 0)`;
    });
  }
  buildStarSlider('starMe');
  buildStarSlider('starHer');
  updateStarSlider('starMe', 3.5);
  updateStarSlider('starHer', 3.5);

  const rMe = document.getElementById('inpRatingMe');
  const rHer = document.getElementById('inpRatingHer');
  function tap(containerId, value) {
    const row = document.getElementById(containerId);
    const idx = Math.min(4, Math.max(0, Math.ceil(value) - 1));
    const cell = row.querySelectorAll('.star-cell')[idx];
    cell.classList.remove('tap'); void cell.offsetWidth; cell.classList.add('tap');
  }
  function bindPreciseStarSlider(input, containerId, valueId) {
    const slider=input.closest('.star-slider');
    let dragging=false;
    let lastValue=Number(input.value);

    function setFromPointer(event) {
      const rect=slider.getBoundingClientRect();
      const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      const value=Math.max(0.5,Math.min(5,Math.round((ratio*5)*2)/2));
      if (value===Number(input.value)) return;
      input.value=String(value);
      updateStarSlider(containerId,value);
      document.getElementById(valueId).textContent=value.toFixed(1);
      tap(containerId,value);
      input.dispatchEvent(new Event('input',{bubbles:true}));
      if (value!==lastValue) { haptic(5); lastValue=value; }
    }

    slider.addEventListener('pointerdown',event=>{
      dragging=true;
      slider.setPointerCapture(event.pointerId);
      setFromPointer(event);
      event.preventDefault();
    });
    slider.addEventListener('pointermove',event=>{
      if(!dragging)return;
      setFromPointer(event);
      event.preventDefault();
    });
    const finish=event=>{
      if(!dragging)return;
      dragging=false;
      if(slider.hasPointerCapture(event.pointerId))slider.releasePointerCapture(event.pointerId);
      haptic(10);
    };
    slider.addEventListener('pointerup',finish);
    slider.addEventListener('pointercancel',finish);
    input.addEventListener('keydown',()=>window.setTimeout(()=>{
      const value=Number(input.value);
      updateStarSlider(containerId,value);
      document.getElementById(valueId).textContent=value.toFixed(1);
    },0));
  }
  bindPreciseStarSlider(rMe,'starMe','valMe');
  bindPreciseStarSlider(rHer,'starHer','valHer');

  // --- kategorie: hodnocené sheet ---
  const categoryLabels = { film: 'Film', serial: 'Seriál' };
  let selectedCategory = 'film';
  const categoryIndicator = document.getElementById('categoryIndicator');
  function setCategoryUI(value) {
    selectedCategory = value;
    document.querySelectorAll('#categoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    categoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
    if (editingIndex === null) document.getElementById('saveMovie').textContent = value === 'serial' ? 'Uložit seriál' : 'Uložit film';
  }
  document.querySelectorAll('#categoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => { setCategoryUI(btn.dataset.value); if (typeof ratedAutocomplete !== 'undefined') ratedAutocomplete.refresh(); });
  });

  // --- kategorie: watchlist sheet ---
  let selectedWatchCategory = 'film';
  const watchCategoryIndicator = document.getElementById('watchCategoryIndicator');
  const watchingField = document.getElementById('watchingField');
  const inpWatching = document.getElementById('inpWatching');
  function setWatchCategoryUI(value) {
    selectedWatchCategory = value;
    document.querySelectorAll('#watchCategoryToggle .segment').forEach(b => b.classList.toggle('active', b.dataset.value === value));
    watchCategoryIndicator.style.transform = value === 'serial' ? 'translateX(100%)' : 'translateX(0%)';
    watchingField.style.display = value === 'serial' ? 'block' : 'none';
    if (value !== 'serial') inpWatching.checked = false;
  }
  document.querySelectorAll('#watchCategoryToggle .segment').forEach(btn => {
    btn.addEventListener('click', () => { setWatchCategoryUI(btn.dataset.value); if (typeof watchAutocomplete !== 'undefined') watchAutocomplete.refresh(); });
  });

  // --- data ---
  let movies = [
    { title: "Perfect Days", category: "film", poster: "", me: 8, her: 9, note: "Klidný, pomalý film o obyčejném životě, který má krásu v detailech." },
    { title: "Anora", category: "film", poster: "", me: 7, her: 7, note: "" },
    { title: "The Bear", category: "serial", poster: "", me: 9, her: 8, note: "" },
    { title: "Poor Things", category: "film", poster: "", me: 9, her: 6, note: "Vizuálně unikátní, ale ne pro každého." }
  ];
  let watchlist = [
    { title: "Poslední z nás", category: "serial", watching: true },
    { title: "Duna: Část druhá", category: "film", watching: false }
  ];
  let editingIndex = null;
  let currentDetailIndex = null;

  const posterFallback = [
    "linear-gradient(160deg,#3a2f1f,#161217)",
    "linear-gradient(160deg,#1f2a3a,#12141c)",
    "linear-gradient(160deg,#2f1f2a,#141116)"
  ];


  const iconEdit = `<svg viewBox="0 0 24 24" fill="none"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const iconDelete = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let pendingDelete = null;
  function bindSwipe(row, onEdit, onDelete) {
    let sx=0, sy=0, dx=0, tracking=false, horizontal=false, suppressClick=false;
    const shell=row.closest('.swipe-shell'), editHint=shell.querySelector('.swipe-hint.edit'), deleteHint=shell.querySelector('.swipe-hint.delete');
    row.addEventListener('touchstart', e=>{ if(e.touches.length!==1)return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; tracking=true; horizontal=false; row.style.transition='none'; },{passive:true});
    row.addEventListener('touchmove', e=>{ if(!tracking)return; const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy; if(!horizontal && Math.abs(x)>8) horizontal=Math.abs(x)>Math.abs(y); if(!horizontal)return; e.preventDefault(); dx=Math.max(-105,Math.min(105,x)); if(!onEdit&&dx>0)dx=0; row.style.transform=`translateX(${dx}px)`; editHint.style.opacity=dx>8?Math.min(1,(dx-8)/55):0; deleteHint.style.opacity=dx<-8?Math.min(1,(-dx-8)/55):0; },{passive:false});
    row.addEventListener('touchend', ()=>{ if(!tracking)return; tracking=false; row.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)'; row.style.transform=''; editHint.style.opacity=0; deleteHint.style.opacity=0; if(Math.abs(dx)>15)suppressClick=true; if(dx>70&&onEdit){haptic(12);onEdit();} if(dx<-70&&onDelete){haptic([10,35,10]);onDelete();} setTimeout(()=>suppressClick=false,280); });
    row.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();}},true);
  }
  function requestDelete(type,index,title){ pendingDelete={type,index}; document.getElementById('confirmText').textContent=`Opravdu chceš smazat „${title}“?`; overlay.classList.add('active'); confirmSheet.classList.add('active'); }
  function openEditAt(index){
    const m=movies[index]; editingIndex=index;
    document.getElementById('inpTitle').value=m.title; document.getElementById('inpPoster').value=m.poster; document.getElementById('inpNote').value=m.note;
    pendingTmdbData={query:m.title,category:m.category,tmdbId:m.tmdbId||null,poster:m.poster||'',genres:m.genres||[],year:m.year||'',description:m.description||''};
    document.getElementById('tmdbStatus').textContent=[m.year,...(m.genres||[])].filter(Boolean).join(' • ');
    document.getElementById('tmdbStatus').className='tmdb-status ok';
    setCategoryUI(m.category); const meVal=m.me/2,herVal=m.her/2; rMe.value=meVal;rHer.value=herVal;
    updateStarSlider('starMe',meVal);updateStarSlider('starHer',herVal);document.getElementById('valMe').textContent=meVal;document.getElementById('valHer').textContent=herVal;
    document.getElementById('saveMovie').textContent=m.category==='serial'?'Uložit změny seriálu':'Uložit změny filmu'; closeSheets(); overlay.classList.add('active');addSheet.classList.add('active');
  }

  function renderList(highlightFirst) {
    const list=document.getElementById('movieList');
    if(!movies.length){list.innerHTML='<div class="empty-state">Zatím žádné filmy. Přidej první tlačítkem dole.</div>';return;}
    list.innerHTML=movies.map((m,i)=>{const bg=m.poster?`background-image:url('${m.poster}')`:`background:${posterFallback[i%posterFallback.length]}`;return `<div class="swipe-shell"><div class="swipe-hint edit">${iconEdit}</div><div class="swipe-hint delete">${iconDelete}</div><div class="movie-row" data-index="${i}"><div class="poster" style="${bg}"></div><div class="movie-info"><h3>${m.title}</h3><span class="badge">${categoryLabels[m.category]||'Film'}</span><div class="ratings"><span class="compact-rating">${(m.me/2).toFixed(1)} ★<span class="rating-name">Bruno</span></span><span class="compact-rating">${(m.her/2).toFixed(1)} ★<span class="rating-name">Zuzi</span></span></div></div></div></div>`}).join('');
    if(highlightFirst)list.querySelector('.movie-row')?.classList.add('enter');
    list.querySelectorAll('.movie-row').forEach(row=>{const i=+row.dataset.index;row.addEventListener('click',()=>{row.classList.remove('card-press');void row.offsetWidth;row.classList.add('card-press');setTimeout(()=>openDetail(i),95);});bindSwipe(row,()=>openEditAt(i),()=>requestDelete('movie',i,movies[i].title));});
  }
  function renderWatchlist(highlightFirst) {
    const list=document.getElementById('watchlistList');
    if(!watchlist.length){list.innerHTML='<div class="empty-state">Watchlist je prázdný. Přidej první tip tlačítkem dole.</div>';return;}
    list.innerHTML=watchlist.map((w,i)=>{
      const posterStyle=w.poster?`background-image:url('${w.poster}')`:`background:${posterFallback[i%posterFallback.length]}`;
      const metadata=[w.year,...(w.genres||[])].filter(Boolean).join(' • ');
      return `<div class="swipe-shell"><div class="swipe-hint edit"></div><div class="swipe-hint delete">${iconDelete}</div><div class="watch-row" data-index="${i}"><button class="watch-check" data-check="${i}" aria-label="Přesunout do hodnocených"></button><div class="watch-poster" style="${posterStyle}"></div><div class="watch-info"><div class="watch-title">${w.title}</div><div class="watch-tags"><span class="badge">${categoryLabels[w.category]||'Film'}</span>${w.category==='serial'&&w.watching?'<span class="badge badge-watching">Sledujeme</span>':''}</div>${metadata?`<div class="watch-meta">${metadata}</div>`:''}</div></div></div>`;
    }).join('');
    if(highlightFirst)list.querySelector('.watch-row')?.classList.add('enter');
    list.querySelectorAll('.watch-check').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();moveToRated(+btn.dataset.check)}));
    list.querySelectorAll('.watch-row').forEach(row=>{const i=+row.dataset.index;bindSwipe(row,null,()=>requestDelete('watch',i,watchlist[i].title));});
  }
  function moveToRated(index) {
    const item = watchlist[index];
    watchlist.splice(index, 1);
    renderWatchlist();
    updateHeaderSummary();
    resetAddForm();
    document.getElementById('inpTitle').value = item.title;
    document.getElementById('inpPoster').value = item.poster || '';
    pendingTmdbData = { query:item.title, category:item.category, tmdbId:item.tmdbId||null, poster:item.poster||'', genres:item.genres||[], year:item.year||'', description:item.description||'' };
    document.getElementById('tmdbStatus').textContent = [item.year,...(item.genres||[])].filter(Boolean).join(' • ');
    document.getElementById('tmdbStatus').className = 'tmdb-status ok';
    setCategoryUI(item.category);
    overlay.classList.add('active');
    addSheet.classList.add('active');
  }

  // --- sheety ---
  const overlay = document.getElementById('overlay');
  const addSheet = document.getElementById('addSheet');
  const watchAddSheet = document.getElementById('watchAddSheet');
  const detailSheet = document.getElementById('detailSheet');
  const confirmSheet = document.getElementById('confirmSheet');
  new MutationObserver(() => setSheetLock(overlay.classList.contains('active'))).observe(overlay,{attributes:true,attributeFilter:['class']});

  function closeSheets() {
    setSheetLock(false);
    overlay.classList.remove('active');
    addSheet.classList.remove('active');
    watchAddSheet.classList.remove('active');
    detailSheet.classList.remove('active');
    confirmSheet.classList.remove('active');
  }
  overlay.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', closeSheets));


  // Detail lze stáhnout dolů přímo za horní šipku.
  (function enableDetailPullDown() {
    const handle = detailSheet.querySelector('.sheet-close');
    let startY = 0;
    let currentY = 0;
    let dragging = false;

    function resetDetailPosition() {
      detailSheet.classList.remove('dragging');
      detailSheet.style.transform = '';
      overlay.style.opacity = '';
    }

    handle.addEventListener('pointerdown', event => {
      if (!detailSheet.classList.contains('active')) return;
      dragging = true;
      startY = event.clientY;
      currentY = 0;
      detailSheet.classList.add('dragging');
      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    handle.addEventListener('pointermove', event => {
      if (!dragging) return;
      currentY = Math.max(0, event.clientY - startY);
      detailSheet.style.transform = `translateY(${currentY}px)`;
      const fade = Math.max(0, 1 - currentY / 320);
      overlay.style.opacity = String(fade);
      event.preventDefault();
    });

    function finishPullDown(event) {
      if (!dragging) return;
      dragging = false;
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
      detailSheet.classList.remove('dragging');

      if (currentY > 110) {
        detailSheet.style.transition = 'transform .22s cubic-bezier(.4,0,1,1)';
        detailSheet.style.transform = 'translateY(100%)';
        overlay.style.opacity = '0';
        window.setTimeout(() => {
          closeSheets();
          detailSheet.style.transition = '';
          resetDetailPosition();
        }, 220);
      } else {
        detailSheet.style.transition = 'transform .24s cubic-bezier(.32,.72,0,1)';
        detailSheet.style.transform = 'translateY(0)';
        overlay.style.opacity = '';
        window.setTimeout(() => {
          detailSheet.style.transition = '';
          detailSheet.style.transform = '';
        }, 240);
      }
      currentY = 0;
    }

    handle.addEventListener('pointerup', finishPullDown);
    handle.addEventListener('pointercancel', finishPullDown);
  })();

  function resetAddForm() {
    document.getElementById('inpTitle').value = '';
    document.getElementById('inpPoster').value = '';
    document.getElementById('inpNote').value = '';
    document.getElementById('tmdbStatus').textContent = '';
    document.getElementById('tmdbStatus').className = 'tmdb-status';
    pendingTmdbData = null;
    setCategoryUI('film');
    rMe.value = 3.5; rHer.value = 3.5;
    updateStarSlider('starMe', 3.5); updateStarSlider('starHer', 3.5);
    document.getElementById('valMe').textContent = '3.5';
    document.getElementById('valHer').textContent = '3.5';
    editingIndex = null;
  }
  function resetWatchForm() {
    document.getElementById('inpWatchTitle').value = '';
    setWatchCategoryUI('film');
  }


  function debounce(fn, wait=280) {
    let timer;
    return (...args) => { clearTimeout(timer); timer=setTimeout(() => fn(...args), wait); };
  }

  async function searchTmdbSuggestions(query, category) {
    if (query.trim().length < 2) return [];
    const type=category==='serial'?'tv':'movie';
    const response=await fetch(`${TMDB_BASE}/search/${type}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=cs-CZ&query=${encodeURIComponent(query.trim())}&include_adult=false`);
    if (!response.ok) throw new Error('suggestions');
    const data=await response.json();
    return (data.results||[]).slice(0,6).map(item => {
      const date=category==='serial'?item.first_air_date:item.release_date;
      return {
        tmdbId:item.id,
        title:category==='serial'?(item.name||item.original_name):(item.title||item.original_title),
        originalTitle:category==='serial'?item.original_name:item.original_title,
        year:date?date.slice(0,4):'',
        poster:item.poster_path?TMDB_IMAGE_BASE+item.poster_path:'',
        genreIds:item.genre_ids||[],
        description:item.overview||''
      };
    });
  }

  function setupAutocomplete(inputId, listId, getCategory, onPick) {
    const input=document.getElementById(inputId), list=document.getElementById(listId);
    let results=[], activeIndex=-1, requestNo=0;
    const close=()=>{ list.classList.remove('active'); list.innerHTML=''; activeIndex=-1; };
    const choose=async item=>{
      input.value=item.title;
      const category=getCategory(), type=category==='serial'?'tv':'movie';
      let genreMap={};
      try { genreMap=await getTmdbGenres(type); } catch(e) {}
      pendingTmdbData={query:item.title,category,tmdbId:item.tmdbId,poster:item.poster,genres:item.genreIds.map(id=>genreMap[id]).filter(Boolean),year:item.year,description:item.description};
      onPick(pendingTmdbData);
      close();
    };
    const run=debounce(async()=>{
      const query=input.value.trim(), current=++requestNo;
      if(query.length<2){close();return;}
      list.innerHTML=Array.from({length:3},()=>'<div class="suggestion-skeleton"><span class="skeleton-poster"></span><span class="skeleton-copy"><span class="skeleton-line"></span><span class="skeleton-line short"></span></span></div>').join(''); list.classList.add('active');
      try {
        const found=await searchTmdbSuggestions(query,getCategory());
        if(current!==requestNo)return;
        results=found;
        if(!found.length){list.innerHTML='<div class="suggestion-empty">Nic nenalezeno</div>';return;}
        list.innerHTML=found.map((item,i)=>`<button type="button" class="suggestion suggestion-in" style="animation-delay:${i*28}ms" data-i="${i}"><span class="suggestion-poster" style="${item.poster?`background-image:url('${item.poster}')`:''}"></span><span class="suggestion-info"><span class="suggestion-title">${item.title}</span><span class="suggestion-meta">${[item.year,item.originalTitle&&item.originalTitle!==item.title?item.originalTitle:''].filter(Boolean).join(' • ')}</span></span></button>`).join('');
        list.querySelectorAll('.suggestion').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();choose(results[+btn.dataset.i]);}));
      } catch(e) { if(current===requestNo) list.innerHTML='<div class="suggestion-empty">Našeptávání se nepodařilo načíst</div>'; }
    });
    input.addEventListener('input',()=>{pendingTmdbData=null;run();});
    input.addEventListener('focus',()=>{if(input.value.trim().length>=2)run();});
    input.addEventListener('keydown',e=>{
      const buttons=[...list.querySelectorAll('.suggestion')];
      if(!buttons.length)return;
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();activeIndex=e.key==='ArrowDown'?Math.min(buttons.length-1,activeIndex+1):Math.max(0,activeIndex-1);buttons.forEach((b,i)=>b.classList.toggle('selected',i===activeIndex));}
      if(e.key==='Enter'&&activeIndex>=0){e.preventDefault();choose(results[activeIndex]);}
      if(e.key==='Escape')close();
    });
    document.addEventListener('pointerdown',e=>{if(!e.target.closest(`#${inputId}`)&&!e.target.closest(`#${listId}`))close();});
    return {refresh:run,close};
  }

  const ratedAutocomplete=setupAutocomplete('inpTitle','titleSuggestions',()=>selectedCategory,data=>{
    if(data.poster)document.getElementById('inpPoster').value=data.poster;
    const status=document.getElementById('tmdbStatus');
    status.className='tmdb-status ok';
    status.textContent=['Nalezeno',data.year,data.genres.join(' • ')].filter(Boolean).join(': ');
  });
  const watchAutocomplete=setupAutocomplete('inpWatchTitle','watchSuggestions',()=>selectedWatchCategory,()=>{});

  document.getElementById('inpTitle').addEventListener('blur', () => loadTmdbData(document.getElementById('inpTitle').value.trim(), selectedCategory));

  const scrollPositions = { rated: 0, watch: 0 };
  let toastTimer = null;
  function updateHeaderSummary() {
    document.getElementById('headerSummary').textContent = `${movies.length} hodnoceno • ${watchlist.length} ve watchlistu`;
  }
  function showSavedToast(message = 'Uloženo') {
    const toast=document.getElementById('saveToast');
    toast.textContent=message;
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
    haptic(10);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),1500);
  }
  function setSheetLock(locked) {
    document.body.classList.toggle('sheet-open',locked);
  }

  // --- taby ---
  const tabRated = document.getElementById('tabRated');
  const tabWatch = document.getElementById('tabWatch');
  const viewRated = document.getElementById('viewRated');
  const viewWatchlist = document.getElementById('viewWatchlist');
  const fab = document.getElementById('openAdd');
  let activeTab = 'rated';
  let tabAnimating = false;
  function setTab(tab) {
    if (tab === activeTab || tabAnimating) return;
    tabAnimating = true;
    const oldTab=activeTab;
    const oldView=oldTab==='rated'?viewRated:viewWatchlist;
    const newView=tab==='rated'?viewRated:viewWatchlist;
    const goingRight=tab==='watch';
    scrollPositions[oldTab]=oldView.scrollTop;
    oldView.classList.add(goingRight?'view-exit-left':'view-exit-right');
    window.setTimeout(()=>{
      oldView.classList.remove('active','view-exit-left','view-exit-right');
      activeTab=tab;
      tabRated.classList.toggle('active',tab==='rated');
      tabWatch.classList.toggle('active',tab==='watch');
      newView.classList.add('active',goingRight?'view-enter-right':'view-enter-left');
      fab.textContent=tab==='rated'?'+ Přidat film':'+ Přidat na watchlist';
      newView.scrollTop=scrollPositions[tab];
      window.setTimeout(()=>{newView.classList.remove('view-enter-left','view-enter-right');tabAnimating=false;},190);
    },140);
  }
  tabRated.addEventListener('click', () => { haptic(7); setTab('rated'); });
  tabWatch.addEventListener('click', () => { haptic(7); setTab('watch'); });

  fab.addEventListener('click', () => {
    overlay.classList.add('active');
    if (activeTab === 'rated') { resetAddForm(); addSheet.classList.add('active'); }
    else { resetWatchForm(); watchAddSheet.classList.add('active'); }
  });

  document.getElementById('saveMovie').addEventListener('click', async () => {
    const title = document.getElementById('inpTitle').value.trim();
    if (!title) return;
    const metadata = await loadTmdbData(title, selectedCategory);
    const existing = editingIndex !== null ? movies[editingIndex] : null;
    const data = {
      title,
      category: selectedCategory,
      poster: document.getElementById('inpPoster').value.trim(),
      me: Math.round(parseFloat(rMe.value) * 2),
      her: Math.round(parseFloat(rHer.value) * 2),
      note: document.getElementById('inpNote').value.trim(),
      tmdbId: metadata?.tmdbId ?? existing?.tmdbId ?? null,
      genres: metadata?.genres ?? existing?.genres ?? [],
      year: metadata?.year ?? existing?.year ?? '',
      description: metadata?.description ?? existing?.description ?? ''
    };
    if (editingIndex !== null) {
      movies[editingIndex] = data;
      renderList(false);
    } else {
      movies.unshift(data);
      renderList(true);
    }
    resetAddForm();
    closeSheets();
    updateHeaderSummary();
    showSavedToast('Uloženo');
  });

  document.getElementById('saveWatch').addEventListener('click', async () => {
    const title = document.getElementById('inpWatchTitle').value.trim();
    if (!title) return;
    const metadata = await loadTmdbData(title, selectedWatchCategory, true);
    watchlist.unshift({
      title,
      category: selectedWatchCategory,
      watching: selectedWatchCategory === 'serial' && inpWatching.checked,
      poster: metadata?.poster || '',
      tmdbId: metadata?.tmdbId || null,
      genres: metadata?.genres || [],
      year: metadata?.year || '',
      description: metadata?.description || ''
    });
    resetWatchForm();
    renderWatchlist(true);
    closeSheets();
    updateHeaderSummary();
    showSavedToast('Uloženo do watchlistu');
  });

  function openDetail(index) {
    currentDetailIndex = index;
    const m = movies[index];
    const posterEl = document.getElementById('detailPoster');
    posterEl.style.background = m.poster ? `url('${m.poster}') center/cover` : posterFallback[index % posterFallback.length];
    document.getElementById('detailTitle').textContent = m.title;
    document.getElementById('detailBadge').textContent = categoryLabels[m.category] || 'Film';
    document.getElementById('detailMe').textContent = `${(m.me / 2).toFixed(1)} ★`;
    document.getElementById('detailHer').textContent = `${(m.her / 2).toFixed(1)} ★`;
    document.getElementById('detailMeta').textContent = [m.year, ...(m.genres || [])].filter(Boolean).join(' • ');
    document.getElementById('detailDescription').textContent = m.description || '';
    document.getElementById('detailDescription').style.display = m.description ? 'block' : 'none';
    document.getElementById('detailNote').textContent = m.note || 'Bez poznámky.';
    overlay.classList.add('active');
    detailSheet.classList.remove('detail-opening');
    detailSheet.classList.add('active');
    void detailSheet.offsetWidth;
    detailSheet.classList.add('detail-opening');
    setTimeout(()=>detailSheet.classList.remove('detail-opening'),300);
  }

  document.getElementById('editMovie').addEventListener('click', () => { if(currentDetailIndex!==null) openEditAt(currentDetailIndex); });


  document.getElementById('cancelDelete').addEventListener('click',closeSheets);
  document.getElementById('confirmDelete').addEventListener('click',()=>{
    if(!pendingDelete)return;
    if(pendingDelete.type==='movie')movies.splice(pendingDelete.index,1);else watchlist.splice(pendingDelete.index,1);
    pendingDelete=null;renderList();renderWatchlist();updateHeaderSummary();closeSheets();
  });
  renderList();
  renderWatchlist();
  updateHeaderSummary();
</script>

</body>
</html>
